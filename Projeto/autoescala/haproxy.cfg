# HAProxy da autoescala (issue #111, ADR docs/adr/Architecture-Decision-Autoescala.md, opção A). Usado SÓ pelo override
# Projeto/docker-compose.autoescala.yml (serviço `lb`); o compose base não o conhece.
#
#   entrada   :8081  -> réplicas do `backend` (gateway), publicada no host como sempre (contrato do Flutter/nginx intacto)
#   reservation :8082 -> réplicas do `reservation`, só na rede gerenciador-net (backend, admission e catalog chamam `lb:8082`)
#
# As réplicas são descobertas pelo DNS do Docker (`server-template` + `resolvers`): entram e saem sem reiniciar o HAProxy. Cada slot nasce
# com peso 100 (réplica nova que o scaler não tocou recebe tráfego quando fica saudável, então o lb funciona com o scaler parado); o
# scaler (autoescala/scaler.sh) põe a réplica nova em stand-by com `set server ... weight 0` logo que o lb a enxerga (ela pode já estar UP com peso
# 100 por até um laço de 2 s; o scaler não a conta como ativa nesse intervalo), promove com `weight 100` e escoa com `state drain`. A Runtime API fica em 127.0.0.1:9999 DENTRO do container (nada publicado):
# o scaler a usa por `docker exec`.

global
    maxconn 20000
    log stdout format raw local0 notice
    stats socket ipv4@127.0.0.1:9999 level admin
    stats timeout 30s

defaults
    mode http
    log global
    # sem `option httplog`: nenhum log por requisição (só o ciclo de vida e as quedas de servidor)
    option dontlognull
    option redispatch
    retries 2
    timeout connect 2s
    # o ReservationClient/AdmissionClient mantêm conexões ociosas por até ~40 s (evict-idle 20 s): o lb as segura mais que isso, para o
    # cliente nunca pegar um socket já fechado por ele
    timeout client 75s
    timeout http-keep-alive 75s
    timeout server 75s
    timeout http-request 10s

# DNS embutido do Docker (a lista de A de um nome de serviço traz o IP de cada réplica)
resolvers docker
    nameserver dns1 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    # só `obsolete` encurta: tira em ~1 s o IP da réplica removida. nx/timeout/other/refused ficam no default (30 s): com 1 s um soluço do DNS
    # embutido marcaria TODOS os slots como DOWN de uma vez (o lb é o ponto único de entrada e do reservation)
    hold obsolete 1s

frontend entrada
    bind :8081
    default_backend gateway

backend gateway
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200
    default-server check inter 2s fastinter 1s fall 3 rise 2 weight 100 resolvers docker init-addr none resolve-prefer ipv4
    server-template gw 1-3 backend:8081

frontend reservation_interno
    bind :8082
    default_backend reservation

backend reservation
    balance roundrobin
    # o reservation não tem health HTTP (o healthcheck do compose é "a porta aceita conexão"): check TCP
    default-server check inter 2s fastinter 1s fall 3 rise 2 weight 100 resolvers docker init-addr none resolve-prefer ipv4
    server-template rs 1-3 reservation:8082
