name: gerenciador-eventos

# Cada item abaixo é um arquivo de compose do Supabase (pooler #19, Studio/meta/kong #20), com
# segredos próprios em supabase/.env. Sem `env_file` no item: a interpolação `${VAR}` do arquivo
# incluído lê o .env da pasta dele, mas o Projeto/.env do backend (que também tem
# JWT_SECRET/POSTGRES_PASSWORD, com outro sentido) VENCE em nomes iguais. Por isso o serviço que
# precisa desses dois segredos os lê pelo `env_file:` do próprio serviço (literal) e só usa `${VAR}`
# em nomes que não colidem (ver supabase/README.md, "Segredos nos compose incluídos").
include:
  - path: ./supabase/docker-compose.pooler.yml
  - path: ./supabase/docker-compose.studio.yml

# Os 7 serviços Java rodam, por padrão, as imagens ENXUTAS do Slim (issue #197, D7), sem `build:`: elas precisam existir localmente
# (`Projeto/slim/gerar-imagens-slim.sh`; `pull_policy: never` faz o `up` falhar na hora com "image not found" em vez de puxar do Docker Hub).
# `SLIM_TAG` (default `latest`; da shell ou do `.env`) escolhe a tag, p.ex. para gerar/usar um lote novo sem tocar o `:latest`. A imagem completa (Dockerfile), para
# depurar, vem pelo override `docker-compose.completa.yml`. O `frontend` continua com `build:`.
services:
  # Postgres do Supabase (issue #18). Pré-requisito: Projeto/supabase/.env existente (ver
  # supabase/README.md). O POSTGRES_USER do container fica o default da imagem
  # (supabase_admin): definir outro quebra o init. O usuário do app (Projeto/.env) entra por
  # APP_DB_*, e Backend/db/supabase-app-init.sql cria a role e o schema.
  db:
    image: supabase/postgres:17.6.1.136
    container_name: gerenciador-db
    env_file:
      - ./supabase/.env
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      PGPORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${POSTGRES_USER}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    ports:
      - "5433:5432"
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
      - ./supabase/volumes/db/functions-role.sql:/docker-entrypoint-initdb.d/init-scripts/98-functions-role.sql:ro
      # Banco _supabase e schema _supavisor: estado interno do Supavisor (issue #19).
      - ./supabase/volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:ro
      - ./supabase/volumes/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:ro
      - ./supabase/volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./Backend/db/supabase-app-init.sql:/docker-entrypoint-initdb.d/migrations/99-app.sql:ro
      - ./Backend/db/init-scripts:/app-init:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Backbone Kafka-compatível (issue #27, ADR "Event-Backbone-Event-Store"). Um nó, modo dev, memória
  # limitada (a máquina já roda Supabase). Só o listener interno redpanda:9092 (sem porta no host);
  # para debug: docker exec gerenciador-redpanda rpk topic list. Tópicos nascem na primeira publicação
  # (o modo dev-container liga auto_create_topics_enabled) com 1 partição. Dados em volume nomeado (descartável).
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    container_name: gerenciador-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # Redis (issue #41): o contador de RPM por evento do serviço admission (chaves adm:cnt:<evento>:<bucket>, todas com TTL) e, desde a #42, o
  # resultado (adm:res:*) e a espera (adm:wait:*, adm:uwait:*) da fila de admissão. Imagem com tag
  # fixa (alpine). Senha OBRIGATÓRIA e sem default: o compose recusa subir sem REDIS_PASSWORD (Projeto/.env, ex.: openssl rand -hex 32;
  # ou exportada na shell só para o comando). SEM persistência (--save "" --appendonly no: é estado descartável, o contador se refaz em
  # 200 ms) e com teto de memória (512 MB, volatile-ttl: só chaves com TTL são candidatas, e toda chave tem; sob pressão saem primeiro as de vida
  # mais curta; desde a #42 guarda também o resultado e a espera da fila de admissão, ~110 MB a 750 req/s em fila). Sem porta no host: só na rede
  # gerenciador-net. O `sh -c` passa pelo docker-entrypoint.sh da imagem oficial (que troca para o usuário redis; sem ele o Redis rodaria como
  # root). Para debug: docker exec gerenciador-redis sh -c 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli keys "adm:*"').
  redis:
    image: redis:7.4.12-alpine
    container_name: gerenciador-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no Projeto/.env (openssl rand -hex 32)}
    command:
      - sh
      - -c
      - exec docker-entrypoint.sh redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no --maxmemory 512mb --maxmemory-policy volatile-ttl
    healthcheck:
      # autenticado: a senha vai pelo ambiente (REDISCLI_AUTH), nunca na linha de comando
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # RabbitMQ (issue #42): a fila de admissão do serviço admission (exchange `admission`, fila `admission.requests` com TTL e dead-letter,
  # declaradas pelo próprio serviço). Imagem com tag fixa (alpine) SEM o plugin de management (sem porta 15672 nem UI). Credenciais
  # OBRIGATÓRIAS e sem default: o compose recusa subir sem RABBITMQ_USER/RABBITMQ_PASSWORD (Projeto/.env, ex.: openssl rand -hex 32; ou
  # exportadas na shell só para o comando). SEM volume persistente: o tmpfs em /var/lib/rabbitmq faz o usuário do 1º boot nascer a cada
  # start (um volume, inclusive o anônimo que a imagem declara, prenderia a senha do 1º boot). Reiniciar o broker perde as mensagens em fila
  # (os resultados `queued` delas viram `timed_out` depois do `deadline`; o cliente repete o POST com a mesma chave). Sem porta no host: só
  # na rede gerenciador-net (o run-tests.sh e o e2e falam com ele por `rabbitmq:5672`).
  rabbitmq:
    image: rabbitmq:4.1.8-alpine
    container_name: gerenciador-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?defina RABBITMQ_USER no Projeto/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no Projeto/.env (openssl rand -hex 32)}
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  backend:
    image: gerenciador-eventos-backend.slim:${SLIM_TAG:-latest}
    pull_policy: never
    container_name: gerenciador-backend
    env_file:
      - ./.env
    environment:
      # O backend fala com o Postgres pelo Supavisor (transaction mode, porta 6543), não direto.
      # prepareThreshold=0: sem prepared statement nomeado no servidor (o PgJDBC só os cria após 5
      # execuções do mesmo PreparedStatement), que em transaction pooling cairia em outra
      # conexão. Usuário no formato <role>.<tenant>; o tenant é o POOLER_TENANT_ID literal do
      # supabase/docker-compose.pooler.yml (não é segredo; se mudar lá, mude aqui). Sobrepõe o env_file ./.env;
      # os testes (run-tests.sh) seguem direto no db, pela URL do Projeto/.env.
      SPRING_DATASOURCE_URL: jdbc:postgresql://supabase-pooler:6543/meu_banco?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}.gerenciador-eventos
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY}
      # O reCAPTCHA (RECAPTCHA_SECRET_KEY) e a assinatura do JWT (chave RSA gerada e guardada no volume identity-keys) saíram do backend
      # na #36: o env_file entrega o .env inteiro, então a chave secreta e o JWT_SECRET (que ninguém lê mais) são sobrepostos por vazio.
      RECAPTCHA_SECRET_KEY: ""
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ""
      # O e-mail saiu do monólito (issue #32, serviço notification): o env_file ./.env entrega o arquivo inteiro, então
      # as credenciais SMTP são sobrepostas por vazio aqui para o backend não recebê-las sem precisar.
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      # O Redis é só do serviço admission (#41): o gateway conta pela API interna dele, nunca fala com o Redis. Sobrepõe por vazio.
      REDIS_PASSWORD: ""
      # O RabbitMQ também é só do serviço admission (#42). Sobrepõe por vazio.
      RABBITMQ_USER: ""
      RABBITMQ_PASSWORD: ""
      # Backbone de eventos (issue #27): o broker interno do compose. Desde a #36 o monólito NÃO appenda evento nenhum (o identity.notification
      # passou ao serviço identity, como o catalog e o reservation têm os deles), então o relay fica DESLIGADO; e desde a #33 ele não tem
      # consumer (a projeção de disponibilidade do braço naive é do serviço reservation).
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      EVENTS_RELAY_ENABLED: "false"
      EVENTS_CONSUMER_ENABLED: "false"
      # Serviço reservation (issue #33): API interna HTTP, só na rede gerenciador-net. O gateway (este container) chama o
      # reservation para reservar/confirmar/cancelar. O braço da reserva
      # (cas = 1 chamada; naive = 2) é decidido AQUI por RESERVATION_READPATH (default cas; os scripts de carga trocam).
      RESERVATION_SERVICE_URL: http://reservation:8082
      # Token de serviço que autentica as chamadas internas (X-Internal-Token). SEM default: vem do Projeto/.env
      # (INTERNAL_API_TOKEN=<openssl rand -hex 32>) e o MESMO valor vai ao reservation e ao catalog; sem ele o backend não sobe.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina INTERNAL_API_TOKEN no Projeto/.env}
      # Pool do cliente HTTP gateway -> reservation >= threads do Tomcat (300); o resto dos timeouts tem default no application.properties.
      RESERVATION_CLIENT_MAX_CONNECTIONS: ${RESERVATION_CLIENT_MAX_CONNECTIONS:-400}
      # Serviço catalog (issue #35): eventos (/bff/events/** e a conferência do evento na reserva) por HTTP, só na rede
      # gerenciador-net. Pool >= threads do Tomcat (300); resposta 15 s, sem retry (default no application.properties).
      CATALOG_SERVICE_URL: http://catalog:8083
      CATALOG_CLIENT_MAX_CONNECTIONS: ${CATALOG_CLIENT_MAX_CONNECTIONS:-400}
      # Serviço admission (issue #41): conta cada POST /bff/event-wallets (nos dois braços) por HTTP, só na rede gerenciador-net. FAIL-OPEN:
      # o backend NÃO depende dele (sem depends_on); admission fora => a reserva segue síncrona, com log. Pool >= threads do Tomcat (300);
      # timeouts curtos e disjuntor com defaults no application.properties (ADMISSION_CLIENT_*).
      ADMISSION_SERVICE_URL: http://admission:8085
      ADMISSION_CLIENT_MAX_CONNECTIONS: ${ADMISSION_CLIENT_MAX_CONNECTIONS:-400}
      # Serviço identity (issue #36): usuários, login, cadastro, MFA, reCAPTCHA e a emissão do JWT RS256 por HTTP, só na rede
      # gerenciador-net. O gateway só VALIDA o JWT (JWKS em IDENTITY_SERVICE_URL/.well-known/jwks.json, cache de 24 h). Pool >= threads
      # do Tomcat (300); resposta 5 s, sem retry (default no application.properties). Hikari do monólito: 10 (só health).
      IDENTITY_SERVICE_URL: http://identity:8084
      IDENTITY_CLIENT_MAX_CONNECTIONS: ${IDENTITY_CLIENT_MAX_CONNECTIONS:-400}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"

    ports:
      - "8081:8081"
    healthcheck:
      # /actuator/health (depende do banco). Sem curl na imagem: GET HTTP/1.0 cru por bash /dev/tcp, esperando "200" na 1ª linha.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      supabase-pooler:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      reservation:
        condition: service_healthy
      catalog:
        condition: service_healthy
      identity:
        condition: service_healthy
    restart: unless-stopped

  # Serviço admission (issue #41, Fase 7): conta cada tentativa de reserva por evento (RPM em janela deslizante, Redis) e expõe a API
  # interna /internal/admissions (porta 8085) SÓ na rede gerenciador-net: SEM porta no host. Imagem e processo próprios
  # (Backend/admission/Dockerfile). SEM datasource (não toca no Postgres: a conta do Supavisor, 1463 <= 1500, não muda). Não usa
  # env_file: recebe só o que precisa, pelo NOME (INTERNAL_API_TOKEN e REDIS_PASSWORD do Projeto/.env, sem os segredos dos outros serviços).
  # O backend NÃO depende dele (fail-open no gateway). Desde a #42 depende também do rabbitmq e do reservation: o worker pool (RABBITMQ) chama
  # o reservation por HTTP (cas) com a Idempotency-Key da mensagem. Desde a #43 o gatilho (uso de X por evento, com histerese) liga o caminho de enfileirar
  # ao POST /internal/admissions: acima do limiar o POST devolve queued e o gateway responde 202.
  admission:
    image: gerenciador-eventos-admission.slim:${SLIM_TAG:-latest}
    pull_policy: never
    container_name: gerenciador-admission
    environment:
      # Token de serviço exigido em toda requisição (401 sem/errado). SEM default: falha no boot sem ele.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina INTERNAL_API_TOKEN no Projeto/.env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no Projeto/.env (openssl rand -hex 32)}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:?defina RABBITMQ_USER no Projeto/.env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no Projeto/.env (openssl rand -hex 32)}
      # O worker pool chama o reservation (POST /internal/reservations?path=cas) com o mesmo token de serviço.
      RESERVATION_SERVICE_URL: http://reservation:8082
      SERVER_TOMCAT_THREADS_MAX: ${SERVER_TOMCAT_THREADS_MAX:-300}
      # Fila de admissão (#42): TTL na fila (tempo máximo de espera), tamanho máximo (reject-publish), concorrência FIXA do worker pool (o teto de
      # CAS simultâneos no reservation), backoff da reentrega, limite de mensagens em espera por usuário e TTL do resultado consultável.
      ADMISSION_QUEUE_TTL_MS: ${ADMISSION_QUEUE_TTL_MS:-30000}
      ADMISSION_QUEUE_MAX_LENGTH: ${ADMISSION_QUEUE_MAX_LENGTH:-100000}
      ADMISSION_WORKER_CONCURRENCY: ${ADMISSION_WORKER_CONCURRENCY:-32}
      ADMISSION_RETRY_BACKOFF_MS: ${ADMISSION_RETRY_BACKOFF_MS:-500}
      ADMISSION_MAX_WAITING_PER_USER: ${ADMISSION_MAX_WAITING_PER_USER:-5}
      ADMISSION_RESULT_TTL_SECONDS: ${ADMISSION_RESULT_TTL_SECONDS:-600}
      ADMISSION_DLX_CONCURRENCY: ${ADMISSION_DLX_CONCURRENCY:-4}
      ADMISSION_PUBLISH_CONFIRM_TIMEOUT_MS: ${ADMISSION_PUBLISH_CONFIRM_TIMEOUT_MS:-200}
      # Gatilho do modo fila (#43): uso = RPM do evento / (X x réplicas ativas do reservation). X = 56000 RPM por evento (medido na #40);
      # réplicas = 1 até a #111. Entra em fila com uso >= 0,80; volta ao síncrono só com uso < 0,70 E a espera do evento vazia (histerese, por evento).
      ADMISSION_X_RPM: ${ADMISSION_X_RPM:-56000}
      ADMISSION_RESERVATION_REPLICAS: ${ADMISSION_RESERVATION_REPLICAS:-1}
      ADMISSION_QUEUE_ON: ${ADMISSION_QUEUE_ON:-0.8}
      ADMISSION_SYNC_BELOW: ${ADMISSION_SYNC_BELOW:-0.7}
      # Contador: buckets de 50 ms numa janela de 200 ms (a janela tem de ser múltiplo do bucket; justificativa na spec do admission).
      ADMISSION_BUCKET_MS: ${ADMISSION_BUCKET_MS:-50}
      ADMISSION_WINDOW_MS: ${ADMISSION_WINDOW_MS:-200}
    healthcheck:
      # sem HTTP de saúde nem curl na imagem: "a porta aceita conexão" (bash /dev/tcp; o /bin/sh da imagem é dash)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8085"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      reservation:
        condition: service_healthy
    restart: unless-stopped

  # Serviço identity (issue #36, Fase 7: quarta extração): dono de users/mywallet/pending_verifications (CRUD, schema `identity`),
  # do login (BCrypt), do cadastro em duas fases, do MFA, do reCAPTCHA e da EMISSÃO do JWT (RS256 + JWKS em /.well-known/jwks.json),
  # com event store/outbox próprios (streams identity.notification, congelado, e identity.user). Imagem e processo próprios
  # (Backend/identity/Dockerfile). API interna (/internal/**, porta 8084) SÓ na rede gerenciador-net: SEM porta no host. Não usa
  # env_file: recebe só o que precisa, pelo NOME (senha do banco e RECAPTCHA_SECRET_KEY do Projeto/.env), sem JWT_SECRET (o JWT é
  # assimétrico: a chave RSA é gerada no 1º boot e persistida no volume identity-keys, sobrevive a restart/rebuild; `down -v` a apaga e
  # todo token antigo vira 401) e sem SMTP.
  # Pool: Hikari 100, pelo Supavisor (mesmo tenant e usuário dos outros: o pool real 45 / 245 NÃO cresce); soma dos Hikari =
  # 1000 (reservation) + 250 (stock) + 10 (backend) + 3 (notification) + 100 (catalog) + 100 (identity) = 1463 <= POOLER_MAX_CLIENT_CONN 1500 (#47).
  # NÃO SOBE com a migração 20261028 pendente (PublicSchemaGuard: public.users ainda existe).
  identity:
    image: gerenciador-eventos-identity.slim:${SLIM_TAG:-latest}
    pull_policy: never
    container_name: gerenciador-identity
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://supabase-pooler:6543/meu_banco?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}.gerenciador-eventos
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "100"
      SERVER_TOMCAT_THREADS_MAX: ${SERVER_TOMCAT_THREADS_MAX:-300}
      # Token de serviço exigido em toda requisição (401 sem/errado, menos o JWKS). SEM default: falha no boot sem ele.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina INTERNAL_API_TOKEN no Projeto/.env}
      # A chave secreta do reCAPTCHA v3 é só deste serviço; a validade do JWT (exp) também.
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-36000}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # Relay do outbox do SERVIÇO (identity.event_outbox -> tópicos identity.notification, que o notification consome, e identity.user).
      # OBRIGATÓRIO: sem ele nenhum e-mail de cadastro/MFA sai.
      EVENTS_RELAY_ENABLED: "true"
    volumes:
      - identity-keys:/var/lib/identity
    healthcheck:
      # sem HTTP de saúde nem curl na imagem: "a porta aceita conexão" (bash /dev/tcp; o /bin/sh da imagem é dash)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8084"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      supabase-pooler:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  # Serviço catalog (issue #35, Fase 7: terceira extração): dono de event/eventpresenter (CQRS + event sourcing, stream
  # catalog.event) no schema `catalog`, com event store, outbox, snapshot e checkpoint próprios. Imagem e processo próprios
  # (Backend/catalog/Dockerfile). API interna (/internal/events/**, porta 8083) SÓ na rede gerenciador-net: SEM porta no host. Não
  # usa env_file: recebe só o que precisa, pelo NOME (senha do banco do Projeto/.env), sem JWT_SECRET/reCAPTCHA/SMTP.
  # Pool: Hikari 100, pelo Supavisor (mesmo tenant e usuário dos outros: o pool real 45 / 245 NÃO cresce); soma dos Hikari =
  # 1000 (reservation) + 250 (stock) + 10 (backend) + 3 (notification) + 100 (catalog) + 100 (identity) = 1463 <= POOLER_MAX_CLIENT_CONN 1500 (#47).
  # Chama o stock (eventcap, #47) por HTTP, mas NÃO depende dele no boot: com o stock fora a criação de evento segue e o
  # eventcap vem pela reconciliação do EventCreated (tópico catalog.event, publicado pelo relay daqui; group stock-catalog).
  catalog:
    image: gerenciador-eventos-catalog.slim:${SLIM_TAG:-latest}
    pull_policy: never
    container_name: gerenciador-catalog
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://supabase-pooler:6543/meu_banco?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}.gerenciador-eventos
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "100"
      SERVER_TOMCAT_THREADS_MAX: ${SERVER_TOMCAT_THREADS_MAX:-300}
      # Token de serviço exigido em toda requisição (401 sem/errado) e enviado ao stock. SEM default: falha no boot sem ele.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina INTERNAL_API_TOKEN no Projeto/.env}
      STOCK_SERVICE_URL: http://stock:8086
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # Relay do outbox do SERVIÇO (catalog.event_outbox -> tópico catalog.event). OBRIGATÓRIO: sem ele o outbox cresce e a
      # reconciliação do eventcap no stock (group stock-catalog) nunca recebe o EventCreated.
      EVENTS_RELAY_ENABLED: "true"
    healthcheck:
      # sem HTTP de saúde nem curl na imagem: "a porta aceita conexão" (bash /dev/tcp; o /bin/sh da imagem é dash)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      supabase-pooler:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  # Serviço reservation (issue #33, Fase 7: segunda extração): dono de eventcap (CAS), walletevent (event sourcing, stream
  # reservation.wallet), idempotency_key e da projeção de disponibilidade, no schema `reservation`. Imagem e processo próprios
  # (Backend/reservation/Dockerfile). A API interna (/internal/**, porta 8082) só existe na rede gerenciador-net: SEM porta
  # no host. Não usa env_file: recebe só o que precisa, pelo NOME (senha do banco do Projeto/.env), sem JWT_SECRET/reCAPTCHA/SMTP.
  # É o CAMINHO QUENTE do experimento: mesmos valores que o monólito tinha no ponto 2 (Tomcat 300, Hikari 1000, virtual threads
  # desligadas). Fala com o Postgres pelo Supavisor, mesmo tenant e mesmo usuário do backend e do notification, então o pool real
  # (45 / 245) NÃO cresce; a conta dos Hikari (1000 + 250 do stock + 10 + 3 + 100 do catalog + 100 do identity = 1463 <= POOLER_MAX_CLIENT_CONN 1500) está no Backend/CLAUDE.md.
  reservation:
    image: gerenciador-eventos-reservation.slim:${SLIM_TAG:-latest}
    pull_policy: never
    container_name: gerenciador-reservation
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://supabase-pooler:6543/meu_banco?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}.gerenciador-eventos
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-1000}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-5}
      SERVER_TOMCAT_THREADS_MAX: ${SERVER_TOMCAT_THREADS_MAX:-300}
      # Token de serviço exigido em todo /internal/** (401 sem/errado). SEM default: o serviço falha no boot se faltar.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina INTERNAL_API_TOKEN no Projeto/.env}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # Relay do outbox do SERVIÇO (reservation.event_outbox) e consumer da projeção de disponibilidade (group `reservation`). A
      # reconciliação do eventcap pelo EventCreated de catalog.event saiu para o stock (#47, group `stock-catalog`).
      EVENTS_RELAY_ENABLED: "true"
      EVENTS_CONSUMER_ENABLED: "true"
      EVENTS_CONSUMER_BATCH_SIZE: ${EVENTS_CONSUMER_BATCH_SIZE:-500}
      # Saga stock + wallet (#47): o reservation orquestra e chama o stock (único destino) por HTTP; reaper, espera e órfã têm default no
      # application.properties (RESERVATION_SAGA_*). O failpoint de teste NÃO tem variável aqui.
      STOCK_SERVICE_URL: http://stock:8086
      # Tamanho do lote do job de expiração de reservas (#61).
      RESERVATION_EXPIRY_BATCH_SIZE: ${RESERVATION_EXPIRY_BATCH_SIZE:-100}
    healthcheck:
      # sem HTTP de saúde nem curl na imagem: o healthcheck é "a porta aceita conexão" (bash /dev/tcp; o /bin/sh da imagem é dash e não tem /dev/tcp, por isso CMD com bash)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      supabase-pooler:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      stock:
        condition: service_healthy
    restart: unless-stopped

  # Serviço stock (issue #47, saga stock + wallet): dono de eventcap (CAS) e do ledger de holds (stock.hold), no schema `stock`. Imagem e
  # processo próprios (Backend/stock/Dockerfile). API interna (/internal/holds e /internal/eventcaps, porta 8086) SÓ na rede gerenciador-net:
  # SEM porta no host. Sem event store nem relay: só CONSOME (devolução da vaga ao cancelar/expirar, group `stock` em reservation.wallet; e
  # reconciliação do eventcap pelo EventCreated, group `stock-catalog`). UMA réplica fixa (D3 da spec), fora do scaler.
  # Pool: Hikari 250 LITERAL (nunca a variável do reservation, que o kit de carga exporta e valeria 1000), pelo Supavisor (mesmo tenant e
  # usuário: o pool real 45 / 245 NÃO cresce); soma dos Hikari = 1000 (reservation) + 250 (stock) + 10 (backend) + 3 (notification) +
  # 100 (catalog) + 100 (identity) = 1463 <= POOLER_MAX_CLIENT_CONN 1500. Mudar esse número exige refazer a conta (Backend/CLAUDE.md, "Serviço stock").
  # Só o reservation depende dele (service_healthy); o catalog NÃO (a criação de evento segue com o stock fora).
  stock:
    image: gerenciador-eventos-stock.slim:${SLIM_TAG:-latest}
    pull_policy: never
    container_name: gerenciador-stock
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://supabase-pooler:6543/meu_banco?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}.gerenciador-eventos
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "250"
      SERVER_TOMCAT_THREADS_MAX: ${SERVER_TOMCAT_THREADS_MAX:-300}
      # Token de serviço exigido em toda requisição (401 sem/errado). SEM default: o serviço falha no boot se faltar.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina INTERNAL_API_TOKEN no Projeto/.env}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      EVENTS_CONSUMER_ENABLED: "true"
      STOCK_RELEASE_CONSUMER_ENABLED: "true"
      STOCK_CATALOG_RECONCILIATION_ENABLED: "true"
    healthcheck:
      # sem HTTP de saúde nem curl na imagem: "a porta aceita conexão" (bash /dev/tcp; o /bin/sh da imagem é dash)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8086"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      supabase-pooler:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      stock-seek:
        condition: service_completed_successfully
    restart: unless-stopped

  # Group `stock` no 1º up (issue #47): o StockReleaseConsumer lê reservation.wallet em `earliest` (com `latest` um cancelamento anterior à 1ª
  # atribuição seria pulado e a vaga ficaria presa); um group NOVO em stack antiga releria o histórico inteiro. One-shot SÓ se o group ainda
  # não existe: move-o para o fim do tópico (como o notification-seek). Group já existente fica intocado. O stock só sobe depois.
  stock-seek:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eo pipefail
        export RPK_BROKERS=redpanda:9092
        grupos="$$(rpk group list)"
        if awk 'NR > 1 && $$2 == "stock" {achou=1} END {exit !achou}' <<<"$$grupos"; then
          echo "group stock já existe: offsets mantidos"
        else
          # o seek falha com UNKNOWN_TOPIC_OR_PARTITION se o tópico ainda não existe (stack nova: quem o cria é o 1º appende do reservation, depois deste one-shot);
          # criar antes é idempotente (já existe = segue) e com 1 partição, como o NewTopic do reservation. O override de autoescala soma as partições depois.
          rpk topic create reservation.wallet -p 1 -r 1 >/dev/null 2>&1 || true
          rpk group seek stock --to end --topics reservation.wallet --allow-new-topics
        fi
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  # Serviço notification (issue #32, Fase 7): consumer do tópico identity.notification que envia e-mail por SMTP.
  # Imagem e processo próprios (Backend/notification/Dockerfile), sem porta HTTP. O monólito não depende dele: com este
  # container parado o cadastro/login seguem normais e o evento espera no tópico (o e-mail sai quando ele volta).
  # NÃO usa env_file: recebe só o que precisa (senha do banco e credenciais SMTP, pelo NOME, interpolados do
  # Projeto/.env), sem JWT_SECRET/reCAPTCHA. Fala com o Postgres pelo Supavisor (mesmo tenant do backend) com um pool
  # Hikari de 3 conexões que NÃO aumenta o pool real do Supavisor (conta no Backend/CLAUDE.md, "Serviço notification").
  notification:
    image: gerenciador-eventos-notification.slim:${SLIM_TAG:-latest}
    pull_policy: never
    container_name: gerenciador-notification
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://supabase-pooler:6543/meu_banco?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}.gerenciador-eventos
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # SMTP: sem MAIL_HOST/MAIL_PORT/MAIL_SMTP_AUTH/MAIL_STARTTLS valem os defaults do application.properties (Gmail 587, auth,
      # STARTTLS obrigatório); a suíte e2e (e2e/docker-compose.e2e.yml) os sobrepõe para um captador de e-mail.
    healthcheck:
      # sem HTTP: "o consumer está ligado ao broker" = há conexão TCP ESTABELECIDA (estado 01) para a porta 9092 (hex 2384) em
      # /proc/net/tcp e tcp6 (o Java abre socket dual-stack: a conexão IPv4 aparece em tcp6) (a imagem não tem curl nem rpk; bash/awk existem).
      test: ["CMD", "bash", "-c", "awk '$$4==\"01\" && $$3 ~ /:2384$$/ {ok=1} END {exit !ok}' /proc/net/tcp /proc/net/tcp6"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      supabase-pooler:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      notification-seek:
        condition: service_completed_successfully
    restart: unless-stopped

  # Group `notification` no 1º up (issue #37): o consumer começa em `earliest`; um group NOVO releria o log inteiro do tópico (evento
  # de teste antigo, de uma stack apagada e recriada, viraria e-mail). One-shot SÓ se o group ainda não existe: move-o para o fim
  # do tópico (o tópico inexistente não falha: --allow-new-topics). Group já existente (stack que reinicia, e-mail legítimo pendente
  # com o notification parado) fica intocado. Termina com 0; o notification só sobe depois (service_completed_successfully).
  notification-seek:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eo pipefail
        export RPK_BROKERS=redpanda:9092
        # falha do rpk (broker fora) ABORTA aqui (set -e): nunca cai no seek por "não consegui listar"
        grupos="$$(rpk group list)"
        if awk 'NR > 1 && $$2 == "notification" {achou=1} END {exit !achou}' <<<"$$grupos"; then
          echo "group notification já existe: offsets mantidos"
        else
          rpk group seek notification --to end --topics identity.notification --allow-new-topics
        fi
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # API_BASE_URL vazio (default do Dockerfile) -> o app chama /bff/... relativo,
      # atrás do proxy do Nginx (issue #78: fim da divisão URL absoluta vs relativa).
    container_name: gerenciador-frontend
    ports:
      - "8088:80"
    healthcheck:
      # nginx:alpine-slim traz o wget do busybox
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # db-data era o PGDATA do Postgres 16 antigo; não sobe no PG17, fica órfão (não apagar).
  supabase-db-data:
    driver: local
  db-config:
    driver: local
  redpanda-data:
    driver: local
  # Chave de assinatura do JWT do identity (JWK privada + pública, arquivo 600). Sobrevive a restart/rebuild; `down -v` a apaga.
  identity-keys:
    driver: local

networks:
  default:
    name: gerenciador-net
    driver: bridge
