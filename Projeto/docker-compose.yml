name: gerenciador-eventos

# Cada item abaixo é um arquivo de compose do Supabase (pooler #19, Studio/meta/kong #20), com
# segredos próprios em supabase/.env. Sem `env_file` no item: a interpolação `${VAR}` do arquivo
# incluído lê o .env da pasta dele, mas o Projeto/.env do backend (que também tem
# JWT_SECRET/POSTGRES_PASSWORD, com outro sentido) VENCE em nomes iguais. Por isso o serviço que
# precisa desses dois segredos os lê pelo `env_file:` do próprio serviço (literal) e só usa `${VAR}`
# em nomes que não colidem (ver supabase/README.md, "Segredos nos compose incluídos").
include:
  - path: ./supabase/docker-compose.pooler.yml
  - path: ./supabase/docker-compose.studio.yml

services:
  # Postgres do Supabase (issue #18). Pré-requisito: Projeto/supabase/.env existente (ver
  # supabase/README.md). O POSTGRES_USER do container fica o default da imagem
  # (supabase_admin): definir outro quebra o init. O usuário do app (Projeto/.env) entra por
  # APP_DB_*, e Backend/db/supabase-app-init.sql cria a role e o schema.
  db:
    image: supabase/postgres:17.6.1.136
    container_name: gerenciador-db
    env_file:
      - ./supabase/.env
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      PGPORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${POSTGRES_USER}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    ports:
      - "5433:5432"
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
      - ./supabase/volumes/db/functions-role.sql:/docker-entrypoint-initdb.d/init-scripts/98-functions-role.sql:ro
      # Banco _supabase e schema _supavisor: estado interno do Supavisor (issue #19).
      - ./supabase/volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:ro
      - ./supabase/volumes/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:ro
      - ./supabase/volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./Backend/db/supabase-app-init.sql:/docker-entrypoint-initdb.d/migrations/99-app.sql:ro
      - ./Backend/db/init-scripts:/app-init:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Backbone Kafka-compatível (issue #27, ADR "Event-Backbone-Event-Store"). Um nó, modo dev, memória
  # limitada (a máquina já roda Supabase). Só o listener interno redpanda:9092 (sem porta no host);
  # para debug: docker exec gerenciador-redpanda rpk topic list. Tópicos nascem na primeira publicação
  # (o modo dev-container liga auto_create_topics_enabled) com 1 partição. Dados em volume nomeado (descartável).
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    container_name: gerenciador-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: monolito/Dockerfile
    container_name: gerenciador-backend
    env_file:
      - ./.env
    environment:
      # O backend fala com o Postgres pelo Supavisor (transaction mode, porta 6543), não direto.
      # prepareThreshold=0: sem prepared statement nomeado no servidor (o PgJDBC só os cria após 5
      # execuções do mesmo PreparedStatement), que em transaction pooling cairia em outra
      # conexão. Usuário no formato <role>.<tenant>; o tenant é o POOLER_TENANT_ID literal do
      # supabase/docker-compose.pooler.yml (não é segredo; se mudar lá, mude aqui). Sobrepõe o env_file ./.env;
      # os testes (run-tests.sh) seguem direto no db, pela URL do Projeto/.env.
      SPRING_DATASOURCE_URL: jdbc:postgresql://supabase-pooler:6543/meu_banco?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}.gerenciador-eventos
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      # O e-mail saiu do monólito (issue #32, serviço notification): o env_file ./.env entrega o arquivo inteiro, então
      # as credenciais SMTP são sobrepostas por vazio aqui para o backend não recebê-las sem precisar.
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      # Backbone de eventos (issue #27): o broker interno do compose. Relay (outbox -> broker) ligado desde a #28
      # (catalog e identity appendam eventos). Desde a #33 o monólito NÃO tem consumer: a projeção de disponibilidade
      # (braço naive) é do serviço reservation.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      EVENTS_RELAY_ENABLED: "true"
      EVENTS_CONSUMER_ENABLED: "false"
      # Serviço reservation (issue #33): API interna HTTP, só na rede gerenciador-net. O gateway (este container) chama o
      # reservation para reservar/confirmar/cancelar e o catalog para criar a capacidade do evento. O braço da reserva
      # (cas = 1 chamada; naive = 2) é decidido AQUI por RESERVATION_READPATH (default cas; os scripts de carga trocam).
      RESERVATION_SERVICE_URL: http://reservation:8082
      # Token de serviço que autentica as chamadas internas (X-Internal-Token). SEM default: vem do Projeto/.env
      # (INTERNAL_API_TOKEN=<openssl rand -hex 32>) e o MESMO valor vai ao reservation; sem ele o backend não sobe.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina INTERNAL_API_TOKEN no Projeto/.env}
      # Pool do cliente HTTP gateway -> reservation >= threads do Tomcat (300); o resto dos timeouts tem default no application.properties.
      RESERVATION_CLIENT_MAX_CONNECTIONS: ${RESERVATION_CLIENT_MAX_CONNECTIONS:-400}

    ports:
      - "8081:8081"
    depends_on:
      supabase-pooler:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      reservation:
        condition: service_healthy
    restart: unless-stopped

  # Serviço reservation (issue #33, Fase 7: segunda extração): dono de eventcap (CAS), walletevent (event sourcing, stream
  # reservation.wallet), idempotency_key e da projeção de disponibilidade, no schema `reservation`. Imagem e processo próprios
  # (Backend/reservation/Dockerfile). A API interna (/internal/**, porta 8082) só existe na rede gerenciador-net: SEM porta
  # no host. Não usa env_file: recebe só o que precisa, pelo NOME (senha do banco do Projeto/.env), sem JWT_SECRET/reCAPTCHA/SMTP.
  # É o CAMINHO QUENTE do experimento: mesmos valores que o monólito tinha no ponto 2 (Tomcat 300, Hikari 1000, virtual threads
  # desligadas). Fala com o Postgres pelo Supavisor, mesmo tenant e mesmo usuário do backend e do notification, então o pool real
  # (45 / 245) NÃO cresce; a conta dos Hikari (1000 + 350 + 3 <= POOLER_MAX_CLIENT_CONN 1500) está no Backend/CLAUDE.md.
  reservation:
    build:
      context: ./Backend
      dockerfile: reservation/Dockerfile
    container_name: gerenciador-reservation
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://supabase-pooler:6543/meu_banco?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}.gerenciador-eventos
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-1000}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-5}
      SERVER_TOMCAT_THREADS_MAX: ${SERVER_TOMCAT_THREADS_MAX:-300}
      # Token de serviço exigido em todo /internal/** (401 sem/errado). SEM default: o serviço falha no boot se faltar.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina INTERNAL_API_TOKEN no Projeto/.env}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # Relay do outbox do SERVIÇO (reservation.event_outbox), consumer da projeção de disponibilidade (group `reservation`)
      # e reconciliação do eventcap pelo EventCreated de catalog.event (group `reservation-catalog`).
      EVENTS_RELAY_ENABLED: "true"
      EVENTS_CONSUMER_ENABLED: "true"
      EVENTS_CONSUMER_BATCH_SIZE: ${EVENTS_CONSUMER_BATCH_SIZE:-500}
      RESERVATION_CATALOG_RECONCILIATION_ENABLED: "true"
    healthcheck:
      # sem HTTP de saúde nem curl na imagem: o healthcheck é "a porta aceita conexão" (bash /dev/tcp; o /bin/sh da imagem é dash e não tem /dev/tcp, por isso CMD com bash)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      supabase-pooler:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  # Serviço notification (issue #32, Fase 7): consumer do tópico identity.notification que envia e-mail por SMTP.
  # Imagem e processo próprios (Backend/notification/Dockerfile), sem porta HTTP. O monólito não depende dele: com este
  # container parado o cadastro/login seguem normais e o evento espera no tópico (o e-mail sai quando ele volta).
  # NÃO usa env_file: recebe só o que precisa (senha do banco e credenciais SMTP, pelo NOME, interpolados do
  # Projeto/.env), sem JWT_SECRET/reCAPTCHA. Fala com o Postgres pelo Supavisor (mesmo tenant do backend) com um pool
  # Hikari de 3 conexões que NÃO aumenta o pool real do Supavisor (conta no Backend/CLAUDE.md, "Serviço notification").
  notification:
    build:
      context: ./Backend
      dockerfile: notification/Dockerfile
    container_name: gerenciador-notification
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://supabase-pooler:6543/meu_banco?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}.gerenciador-eventos
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      supabase-pooler:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # API_BASE_URL vazio (default do Dockerfile) -> o app chama /bff/... relativo,
      # atrás do proxy do Nginx (issue #78: fim da divisão URL absoluta vs relativa).
    container_name: gerenciador-frontend
    ports:
      - "8088:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  # db-data era o PGDATA do Postgres 16 antigo; não sobe no PG17, fica órfão (não apagar).
  supabase-db-data:
    driver: local
  db-config:
    driver: local
  redpanda-data:
    driver: local

networks:
  default:
    name: gerenciador-net
    driver: bridge
