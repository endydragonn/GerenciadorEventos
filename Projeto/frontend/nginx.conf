server {
    listen 80;
    server_name localhost;
    
    # Raiz do frontend (arquivos estáticos Flutter)
    root /usr/share/nginx/html;
    index index.html;

    # Configuração para Single Page Application (Flutter)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para o backend - superfície HTTP única sob /bff/* (issue #78).
    # Este arquivo é um TEMPLATE da imagem oficial do nginx (envsubst, só ${BACKEND_*}); BACKEND_UPSTREAM vale backend:8081 (default do
    # Dockerfile) e o override da autoescala (docker-compose.autoescala.yml, issue #111) o troca por lb:8081.
    # SEM rewrite/strip: /bff/... chega no backend como /bff/... (location e proxy_pass
    # com o mesmo prefixo /bff/, então o nginx repassa a URI inalterada).
    location /bff/ {
        proxy_pass http://${BACKEND_UPSTREAM}/bff/;

        # Headers necessários para proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
