# Override SO do teste de taxa (RPM). Usado JUNTO com o de carga:
#   docker compose -f docker-compose.yml -f carga/docker-compose.carga.yml -f carga/rpm/docker-compose.rpm.yml up -d
# O backend usa DriverManager (sem pool): 1 conexao por requisicao. O padrao do Postgres (100)
# estoura antes dos 200 threads do Tomcat. Valor via env para comparar 100 x 300.
services:
  db:
    command: ["postgres", "-c", "max_connections=${PG_MAX_CONNECTIONS:-300}"]
