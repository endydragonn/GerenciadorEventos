# Override SO do teste de taxa (RPM). Usado JUNTO com o de carga:
#   docker compose -f docker-compose.yml -f carga/docker-compose.carga.yml -f carga/rpm/docker-compose.rpm.yml up -d
# O backend fala com o Postgres pelo Supavisor (issue #19): o Hikari (default 1000, cresce sob
# demanda) so enfileira no pooler, e quem chega ao Postgres e o pool do Supavisor
# (POOLER_DEFAULT_POOL_SIZE). Por isso este override sobe o max_connections do db E o pool do
# pooler juntos: PG_MAX_CONNECTIONS (default 300) e PG_POOLER_POOL_SIZE (default 245 = 300 - 55,
# a mesma folga do padrao 100 -> 45; o subir-host-rpm.ps1 deriva do -MaxConnections). Um pool
# acima do max_connections da 'too many clients'. Valor via env para comparar 100 x 300.
services:
  db:
    # Repete o command do db (docker-compose.yml): sem config_file o Postgres da imagem
    # supabase/postgres ignora /etc/postgresql/postgresql.conf. Acrescenta max_connections.
    # log_min_messages=fatal evita que os ALTER USER ... PASSWORD do primeiro init (via override) vazem no docker logs.
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal", "-c", "max_connections=${PG_MAX_CONNECTIONS:-300}"]
  supabase-pooler:
    environment:
      POOLER_DEFAULT_POOL_SIZE: ${PG_POOLER_POOL_SIZE:-245}
