# Configuração da porta do servidor
server.port=8081

# Configurações da aplicação
spring.application.name=GerenciadorEventos

# Configurações do banco de dados PostgreSQL
# No Docker: SPRING_DATASOURCE_URL será jdbc:postgresql://db:5432/meu_banco
# Local: usa localhost:5433 (porta mapeada no docker-compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/meu_banco?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:senha123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Encoding UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Configurações adicionais
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT
jwt.secret=${JWT_SECRET:dev-secret-change-me-please-32-bytes-minimum-123456}
jwt.expirationSeconds=${JWT_EXPIRATION_SECONDS:36000}

# Configuração de Email (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Actuator (issue #92): só /actuator/health. O health do mail fica desligado para o status
# não depender do SMTP do Gmail (DOWN se a rede/credencial falhar); o do DB continua.
management.endpoints.web.exposure.include=health
management.health.mail.enabled=false

# Configuração de Verificação de Email
verification.code.length=6
verification.code.expiration.minutes=5
verification.code.max.attempts=5

# Caminho de leitura da reserva: "cas" (default, UPDATE condicional atômico em eventcap)
# ou "naive" (lê event_availability defasado e insere sem CAS — braço de controle do
# experimento da Fase 2; OVERSELLA de propósito). Trocável por env sem rebuild.
reservation.readpath=${RESERVATION_READPATH:cas}

# Intervalo do job que atualiza o read model event_availability. Maior = mais lag =
# mais overselling no caminho ingênuo.
readmodel.availability.refresh.ms=${READMODEL_AVAILABILITY_REFRESH_MS:5000}