# Configuração da porta do servidor
server.port=8081

# Configurações da aplicação
spring.application.name=GerenciadorEventos

# Configurações do banco de dados PostgreSQL
# No Docker: SPRING_DATASOURCE_URL será jdbc:postgresql://db:5432/meu_banco
# Local: usa localhost:5433 (porta mapeada no docker-compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/meu_banco?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:senha123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool HikariCP (issue #96). Antes cada operação abria uma conexão nova (DriverManager) e sob
# carga esgotava as portas efêmeras (TIME_WAIT -> BindException). Default 1000: alinhado ao
# max_connections=1000 do Postgres do host de desenvolvimento/carga. ATENÇÃO: o `db` do
# docker-compose padrão tem max_connections=100; lá reduza o pool por env (ex.:
# SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=50), senão sob carga dá 'too many clients'.
# minimum-idle pequeno (5): o pool cresce só sob demanda até o máximo e encolhe em repouso. Sem
# isso minimum-idle = maximum e cada contexto Spring (inclusive cada contexto de teste
# distinto, cada um com seu pool) seguraria 1000 conexões fixas e estouraria o max_connections.
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:1000}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}

# Threads do Tomcat (issue #124): default do Spring Boot é 200. Os testes de 2026-10-17 pelo
# pooler deram o mesmo teto de vazão com 200, 300 e 400, mas 300 teve o menor p95 (matriz CAS
# N=200: 155 -> 114 ms; escada 50k-70k: 180-319 ms contra 192-392 ms com 200). Virtual threads
# seguem desligadas (padrão): sobem a vazão (~99k efetivos), mas pioram o p95.
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:300}

# Configurações do JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Encoding UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Configurações adicionais
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT
jwt.secret=${JWT_SECRET:dev-secret-change-me-please-32-bytes-minimum-123456}
jwt.expirationSeconds=${JWT_EXPIRATION_SECONDS:36000}

# Configuração de Email (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Actuator (issue #92): só /actuator/health. O health do mail fica desligado para o status
# não depender do SMTP do Gmail (DOWN se a rede/credencial falhar); o do DB continua.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# Configuração de Verificação de Email
verification.code.length=6
verification.code.expiration.minutes=5
verification.code.max.attempts=5

# Caminho de leitura da reserva: "cas" (default, UPDATE condicional atômico em eventcap)
# ou "naive" (lê event_availability defasado e insere sem CAS — braço de controle do
# experimento da Fase 2; OVERSELLA de propósito). Trocável por env sem rebuild.
reservation.readpath=${RESERVATION_READPATH:cas}

# Backbone de eventos (issue #27, ADR Event-Backbone-Event-Store). Broker Kafka-compatível (Redpanda); no
# Docker é redpanda:9092 (SPRING_KAFKA_BOOTSTRAP_SERVERS no compose e no run-tests.sh). Só é usado quando o relay
# ou o consumer estão ligados (as flags events.*.enabled, desligadas por padrão). No compose o backend espera o
# Redpanda ficar healthy (depends_on), porque a #28/#29 ligam o relay; fora do compose (mvn spring-boot:run) o
# backend sobe sem broker enquanto as flags estiverem desligadas.
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Producer do relay: idempotente + acks=all (publicação at-least-once, sem duplicata por retry interno).
# max.block.ms/delivery.timeout.ms curtos: o relay segura uma conexão do pooler enquanto envia, então com o
# broker fora a transação falha em segundos em vez de ficar presa (delivery.timeout >= request.timeout + linger).
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000
# Consumer: ack manual depois do commit da projeção; offset só avança por ack. earliest (fixo): um group novo lê o
# log inteiro e não pula nada; o checkpoint por stream e a conferência do eventId descartam o que já foi aplicado
# ou sobrou de outro estado do banco. O @KafkaListener das projeções NÃO pode usar id= como group (idIsGroup=false),
# senão este group-id não vale.
spring.kafka.consumer.group-id=${EVENTS_CONSUMER_GROUP:gerenciador-eventos}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=manual

# Relay outbox -> broker. Desligado por padrão (o compose liga: #28/#29 appendam eventos); ligue com EVENTS_RELAY_ENABLED=true.
events.relay.enabled=${EVENTS_RELAY_ENABLED:false}
events.relay.interval-ms=${EVENTS_RELAY_INTERVAL_MS:50}
events.relay.batch-size=${EVENTS_RELAY_BATCH_SIZE:200}
# Consumer idempotente (listeners das projeções assíncronas). Erro transitório (banco/conexão): retry exponencial
# sem limite, nunca DLT. Buraco irrecuperável no stream: max-attempts retries a cada interval-ms e depois
# <tópico>.DLT. Payload inválido: DLT direto.
events.consumer.enabled=${EVENTS_CONSUMER_ENABLED:false}
events.consumer.retry.interval-ms=${EVENTS_CONSUMER_RETRY_INTERVAL_MS:1000}
events.consumer.retry.max-attempts=${EVENTS_CONSUMER_RETRY_MAX_ATTEMPTS:5}
# O retry transitório é ilimitado: a partir desta tentativa (de uma mesma mensagem) cada falha loga em ERROR.
events.consumer.retry.error-after-attempts=${EVENTS_CONSUMER_RETRY_ERROR_AFTER_ATTEMPTS:10}
# Snapshot de stream a cada N eventos (cache descartável; N alto de propósito).
events.snapshot.every=${EVENTS_SNAPSHOT_EVERY:100}

# Retenção da tabela idempotency_key (issue #130): o job apaga, em lotes, as chaves com created_at
# mais antigo que retention.hours (default 24h, a janela em que um retry do cliente faz sentido),
# a cada scan.ms (default 10 min).
idempotency.retention.hours=${IDEMPOTENCY_RETENTION_HOURS:24}
idempotency.retention.scan.ms=${IDEMPOTENCY_RETENTION_SCAN_MS:600000}

# Pool do scheduler dos @Scheduled. O default do Boot é 1 thread, compartilhada pelo OutboxRelay (que ocupa uma
# thread enquanto houver outbox), ReservationExpiryService e IdempotencyKeyRetentionService: um purge em massa no
# meio de uma rodada de carga seguraria o relay e falsearia o lag medido do braço naive.
spring.task.scheduling.pool.size=${SPRING_TASK_SCHEDULING_POOL_SIZE:3}
