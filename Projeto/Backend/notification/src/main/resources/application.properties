# Serviço notification (issue #32, Fase 7): consumer do tópico identity.notification que envia e-mail por SMTP.
# Sem HTTP (sem Tomcat, sem actuator): o container só vive e consome. As variáveis de ambiente têm os MESMOS nomes
# que o monólito usava (SPRING_DATASOURCE_*, MAIL_*, SPRING_KAFKA_BOOTSTRAP_SERVERS); os valores reais vêm do
# Projeto/.env pelo docker-compose (nunca commitar/imprimir).
spring.application.name=notification
spring.main.web-application-type=none

# Banco: no Docker, pelo Supavisor (SPRING_DATASOURCE_URL do compose); local, direto em localhost:5433.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/meu_banco?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:senha123}
spring.datasource.driver-class-name=org.postgresql.Driver
# Pool Hikari PEQUENO de propósito (a conta está no Backend/CLAUDE.md, "Serviço notification"): o serviço tem 1 listener
# (tópico de 1 partição, 1 thread) e só 1 transação aberta por vez; 3 dá folga para uma reconexão. O pool real do
# Supavisor (45 / 245) é compartilhado com o monólito e NÃO cresce por causa deste serviço. minimum-idle 1 para não
# segurar 3 conexões ociosas.
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}

# E-mail (Gmail SMTP): mesmas variáveis do monólito. Timeouts curtos: a transação do consumer fica aberta durante o envio.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Backbone: broker Kafka-compatível (Redpanda). Group PRÓPRIO do serviço (não o EVENTS_CONSUMER_GROUP do monólito). Ack
# manual depois do commit; earliest: um group novo lê o log inteiro (o checkpoint por eventId descarta o que já foi enviado).
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${NOTIFICATION_CONSUMER_GROUP:notification}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=manual_immediate
# Poucos registros por poll: cada e-mail leva 1 a 3 s (até ~15 s com timeout) e o max.poll.interval.ms é de 5 min; com o
# default de 500 um backlog grande (o notification ficou fora e voltou) estouraria o intervalo e giraria em rebalance.
spring.kafka.consumer.max-poll-records=10
# Aplica a retenção curta do tópico e do .DLT (NotificationEvents.topic()) também quando eles já existem (nasceram com 7 dias).
spring.kafka.admin.modify-topic-configs=true
# Producer: só para publicar no .DLT (EventsKafkaConfig); mesmos timeouts curtos do monólito.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000

# Política de erro do consumer (EventsKafkaConfig, da shared): ligada sempre aqui. Erro transitório (SMTP/banco fora):
# retry exponencial sem limite e sem DLT; payload inválido ou destinatário rejeitado pelo SMTP: DLT direto.
events.consumer.enabled=true
events.consumer.retry.interval-ms=${EVENTS_CONSUMER_RETRY_INTERVAL_MS:1000}
events.consumer.retry.max-attempts=${EVENTS_CONSUMER_RETRY_MAX_ATTEMPTS:5}
events.consumer.retry.error-after-attempts=${EVENTS_CONSUMER_RETRY_ERROR_AFTER_ATTEMPTS:10}
