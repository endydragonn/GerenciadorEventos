# Serviço admission (issue #41, Fase 7): contador de RPM por evento em Redis + API interna HTTP chamada pelo gateway. SEM datasource
# (não depende de "shared": não toca no Postgres). Variáveis de ambiente (nomes aqui; valores reais em Projeto/.env, nunca imprimir).
spring.application.name=admission
server.port=8085

# Tomcat como o reservation: 300 threads, virtual threads DESLIGADAS (padrão; não há spring.threads.virtual.enabled). O gateway
# reaproveita as conexões (keep-alive): sem teto de requisições por conexão e keep-alive-timeout (60 s) MAIOR que o evict-idle do
# cliente (admission.client.evict-idle-ms = 20 s), para o cliente nunca pegar um socket já fechado.
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:300}
server.tomcat.max-keep-alive-requests=${SERVER_TOMCAT_MAX_KEEP_ALIVE_REQUESTS:-1}
server.tomcat.keep-alive-timeout=${SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT:60s}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Token de serviço que autentica as chamadas internas do gateway (header X-Internal-Token em TODA requisição; 401 sem/errado).
# SEM valor default de propósito: o serviço falha no boot se INTERNAL_API_TOKEN faltar (InternalTokenFilter).
internal.api.token=${INTERNAL_API_TOKEN:}

# Redis (Lettuce). Senha SEM default (REDIS_PASSWORD no Projeto/.env; o compose recusa subir sem ela). Timeouts de 200 ms: o Redis
# lento ou fora vira fail-open (modo sync) rápido, nunca uma reserva presa esperando o contador.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${ADMISSION_REDIS_TIMEOUT_MS:200}ms
spring.data.redis.connect-timeout=${ADMISSION_REDIS_TIMEOUT_MS:200}ms

# Contador: buckets de 50 ms somados numa janela de 200 ms (a janela tem de ser múltiplo do bucket). Justificativa da janela em
# docs/superpowers/specs/2026-10-28-admission-servico-design.md: a rajada por evento na escada dura ~0,2 s, então uma janela de 1 s
# leria 1/5 da taxa e uma de 60 s nunca dispararia o gatilho da #43.
admission.bucket-ms=${ADMISSION_BUCKET_MS:50}
admission.window-ms=${ADMISSION_WINDOW_MS:200}

# Sem Spring Security, sem actuator: a API interna só é alcançável na rede gerenciador-net (sem porta no host); o healthcheck é TCP.
