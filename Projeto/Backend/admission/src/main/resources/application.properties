# Serviço admission (issues #41 e #42, Fase 7): contador de RPM por evento em Redis, fila de admissão (RabbitMQ) com worker pool que chama o
# reservation, e a API interna HTTP chamada pelo gateway. SEM datasource
# (não depende de "shared": não toca no Postgres). Variáveis de ambiente (nomes aqui; valores reais em Projeto/.env, nunca imprimir).
spring.application.name=admission
server.port=8085

# Tomcat como o reservation: 300 threads, virtual threads DESLIGADAS (padrão; não há spring.threads.virtual.enabled). O gateway
# reaproveita as conexões (keep-alive): sem teto de requisições por conexão e keep-alive-timeout (60 s) MAIOR que o evict-idle do
# cliente (admission.client.evict-idle-ms = 20 s), para o cliente nunca pegar um socket já fechado.
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:300}
server.tomcat.max-keep-alive-requests=${SERVER_TOMCAT_MAX_KEEP_ALIVE_REQUESTS:-1}
server.tomcat.keep-alive-timeout=${SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT:60s}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Token de serviço que autentica as chamadas internas do gateway (header X-Internal-Token em TODA requisição; 401 sem/errado).
# SEM valor default de propósito: o serviço falha no boot se INTERNAL_API_TOKEN faltar (InternalTokenFilter).
internal.api.token=${INTERNAL_API_TOKEN:}

# Redis (Lettuce). Senha SEM default (REDIS_PASSWORD no Projeto/.env; o compose recusa subir sem ela). Timeouts de 200 ms: o Redis
# lento ou fora vira fail-open (modo sync) rápido, nunca uma reserva presa esperando o contador.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${ADMISSION_REDIS_TIMEOUT_MS:200}ms
spring.data.redis.connect-timeout=${ADMISSION_REDIS_TIMEOUT_MS:200}ms

# Contador: buckets de 50 ms somados numa janela de 200 ms (a janela tem de ser múltiplo do bucket). Justificativa da janela em
# docs/superpowers/specs/2026-10-28-admission-servico-design.md: a rajada por evento na escada dura ~0,2 s, então uma janela de 1 s
# leria 1/5 da taxa e uma de 60 s nunca dispararia o gatilho da #43.
admission.bucket-ms=${ADMISSION_BUCKET_MS:50}
admission.window-ms=${ADMISSION_WINDOW_MS:200}

# Sem Spring Security: a API interna só é alcançável na rede gerenciador-net (sem porta no host); o healthcheck é TCP.
# Actuator (issue #197): o HTTP de management fica DESLIGADO (-1) e o compose não muda. O manifest do Kubernetes liga a porta própria
# (MANAGEMENT_SERVER_PORT=8090, outro conector e outro pool de threads que a API) só para as probes de /actuator/health/{liveness,readiness};
# só `health`, sem detalhes. O filtro do X-Internal-Token é do contexto da API e não vale na porta de management.
management.server.port=-1
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Sem o timer por requisição (observação http.server.requests) no caminho quente; o Micrometer do actuator segue com os binders de JVM/Hikari/Tomcat e a observação dos @Scheduled.
management.observations.enable.http.server.requests=false

# RabbitMQ (issue #42, Spring AMQP). Usuário e senha SEM default (RABBITMQ_USER/RABBITMQ_PASSWORD no Projeto/.env; o compose recusa subir sem
# elas). Publisher confirms correlacionados + returns + mandatory: nack do broker = fila cheia (reject-publish), return = mensagem sem rota.
# Prefetch 1 no worker (cada worker segura no máximo uma mensagem). Conectar em 2 s: o broker fora vira "não publicada" (sync), não 60 s presos.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.connection-timeout=2s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.prefetch=1
# O CachingConnectionFactory loga em INFO o toString da conexão (amqp://<usuário>@<host>:5672/...), que traria o RABBITMQ_USER do Projeto/.env
# para o log (regra "Segredos" do CLAUDE.md). WARN mantém só as falhas de conexão. Coberto por AdmissionLogsTest.
logging.level.org.springframework.amqp.rabbit.connection.CachingConnectionFactory=WARN

# Fila de admissão. Prefixo dos nomes (exchange e filas): vazio em produção, um por classe de teste. TTL = tempo máximo na fila;
# max-length + reject-publish = fila cheia vira nack ao publicador (429).
admission.amqp.prefix=${ADMISSION_AMQP_PREFIX:}
admission.queue.ttl-ms=${ADMISSION_QUEUE_TTL_MS:30000}
admission.queue.max-length=${ADMISSION_QUEUE_MAX_LENGTH:100000}
# Publicação: sem confirmação em 200 ms = tratada como publicada (desfazer apagaria o resultado de uma mensagem que pode estar na fila).
admission.publish.confirm-timeout-ms=${ADMISSION_PUBLISH_CONFIRM_TIMEOUT_MS:200}

# Worker pool: concorrência FIXA = teto de CAS simultâneos no reservation (o pool do ReservationClient é essa concorrência + a da dead-letter, que só faz replay, leitura). Backoff na reentrega.
admission.worker.enabled=${ADMISSION_WORKER_ENABLED:true}
admission.worker.concurrency=${ADMISSION_WORKER_CONCURRENCY:32}
admission.dlx.concurrency=${ADMISSION_DLX_CONCURRENCY:4}
admission.retry-backoff-ms=${ADMISSION_RETRY_BACKOFF_MS:500}

# Resultado por mensagem (Redis, toda escrita com TTL: cobre a janela de confirmação com folga) e limite de mensagens em espera por usuário.
admission.result-ttl-seconds=${ADMISSION_RESULT_TTL_SECONDS:600}
admission.max-waiting-per-user=${ADMISSION_MAX_WAITING_PER_USER:5}

# O worker chama o reservation por HTTP (o mesmo INTERNAL_API_TOKEN, header X-Internal-Token).
reservation.service.url=${RESERVATION_SERVICE_URL:http://localhost:8082}

# Gatilho do modo fila (issue #43). uso = RPM do evento / (X x réplicas ativas do reservation). X = capacidade medida na #40 (56k RPM por evento,
# linha quente do eventcap); réplicas = 1 até a #111. Entra em fila com uso >= 0,80; volta ao síncrono só com uso < 0,70 E a espera do evento vazia
# (histerese, por evento). Valores só pelo ambiente: queue-on tem de ser maior que sync-below.
admission.x-rpm=${ADMISSION_X_RPM:56000}
admission.reservation-replicas=${ADMISSION_RESERVATION_REPLICAS:1}
admission.queue-on=${ADMISSION_QUEUE_ON:0.8}
admission.sync-below=${ADMISSION_SYNC_BELOW:0.7}

# Balanceamento no cliente (trilha C do Kubernetes, issue #197): DNS round-robin + TTL de conexao + reuso FIFO nos clientes HTTP deste servico.
# Desligado por padrao (a montagem dos clientes e a de sempre); o overlay k8s/overlays/trilha-c liga e aponta os *_SERVICE_URL para os Services headless.
client.lb.enabled=${CLIENT_LB_ENABLED:false}
client.lb.ttl-ms=${CLIENT_LB_TTL_MS:15000}

# Token SO de metrica (issue #197, P3): o KEDA chama GET /internal/metrics/hot (RPM do evento mais quente, adm:hot) com ele, e o INTERNAL_API_TOKEN mestre
# nao abre a rota exata (variacoes de metodo/URI caem no mestre, ja superconjunto: impacto nulo); o de metrica nao abre outra. SEM valor default: ausente (compose) a rota responde 401 a tudo e o servico sobe normalmente. So o cluster
# Kubernetes o define (cluster.sh gera um valor aleatorio a cada `up`, fora do .env).
admission.metrics.token=${ADMISSION_METRICS_TOKEN:}

# Replicas ativas do reservation pela API do Kubernetes (issue #197, D4): job de 2 s que grava adm:replicas (TTL 15 s) com status.readyReplicas do Deployment
# reservation. DESLIGADO por padrao (compose); so o manifest do cluster o liga. Falha nao grava (vale ADMISSION_RESERVATION_REPLICAS). O maximo (K8S_RESERVATION_MAX)
# e o mesmo que o cluster.sh poe no maxReplicaCount do reservation: leitura fora de [1, max] nao grava.
admission.k8s.replicas.enabled=${ADMISSION_K8S_REPLICAS_ENABLED:false}
admission.k8s.replicas.max=${K8S_RESERVATION_MAX:3}
