# Configuração da porta do servidor
server.port=8081

# Configurações da aplicação
spring.application.name=GerenciadorEventos

# Configurações do banco de dados PostgreSQL
# No Docker: SPRING_DATASOURCE_URL será jdbc:postgresql://db:5432/meu_banco
# Local: usa localhost:5433 (porta mapeada no docker-compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/meu_banco?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:senha123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool HikariCP (issue #96). Antes cada operação abria uma conexão nova (DriverManager) e sob
# carga esgotava as portas efêmeras (TIME_WAIT -> BindException). ATENÇÃO: o `db` do
# docker-compose padrão tem max_connections=100; lá reduza o pool por env (ex.:
# SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=50), senão sob carga dá 'too many clients'.
# minimum-idle pequeno (5): o pool cresce só sob demanda até o máximo e encolhe em repouso. Sem
# isso minimum-idle = maximum e cada contexto Spring (inclusive cada contexto de teste
# distinto, cada um com seu pool) seguraria 350 conexões fixas e estouraria o max_connections.
# Desde a #33 o caminho quente da reserva (Hikari 1000) é do serviço reservation, desde a #35 o evento é do catalog e desde a #36
# usuários/carteira/login são do identity: o gateway não toca mais em tabela de domínio. O datasource que sobrou serve ao
# /actuator/health (depende do banco) e aos testes da infra shared.events, então 10 conexões bastam. A soma dos Hikari
# (1000 do reservation + 10 deste + 3 do notification + 100 do catalog + 100 do identity = 1213; 1463 com os 250 do stock, #47) cabe no POOLER_MAX_CLIENT_CONN=1500
# (Backend/CLAUDE.md, "Serviço reservation", "Serviço catalog" e "Serviço identity").
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}

# Threads do Tomcat (issue #124): default do Spring Boot é 200. Os testes de 2026-10-17 pelo
# pooler deram o mesmo teto de vazão com 200, 300 e 400, mas 300 teve o menor p95 (matriz CAS
# N=200: 155 -> 114 ms; escada 50k-70k: 180-319 ms contra 192-392 ms com 200). Virtual threads
# seguem desligadas (padrão): sobem a vazão (~99k efetivos), mas pioram o p95. Mantido em 300 no monólito/gateway
# (cada requisição segura uma thread durante a chamada ao reservation); o reservation tem os mesmos 300.
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:300}

# Configurações do JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Encoding UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Configurações adicionais
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT (issue #36): o gateway só VALIDA o RS256 que o serviço identity assina (JWKS em identity.service.url/.well-known/jwks.json).
# JWT_SECRET e JWT_EXPIRATION_SECONDS deixaram de ser lidos aqui (a emissão e o exp são do identity).
jwt.issuer=${JWT_ISSUER:gerenciador-identity}
# Cache das chaves públicas: 24 h; no máximo UM refetch a cada 30 s (inclusive por kid desconhecido: kid aleatório num bearer
# anônimo nunca vira um fetch por requisição); com o identity fora, a chave em cache segue valendo por até 24 h.
jwt.jwks.cache-ttl-ms=${JWT_JWKS_CACHE_TTL_MS:86400000}
jwt.jwks.min-refresh-interval-ms=${JWT_JWKS_MIN_REFRESH_INTERVAL_MS:30000}
jwt.jwks.outage-tolerance-ms=${JWT_JWKS_OUTAGE_TOLERANCE_MS:86400000}

# Actuator (issue #92): só /actuator/health (depende do DB). O e-mail saiu do monólito na #32 (serviço notification).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Serviço identity (issue #36): API interna HTTP /internal/** (http://identity:8084 no compose), chamada pelo gateway pelo
# IdentityClient (lib identity-client) com o mesmo INTERNAL_API_TOKEN. Pool >= threads do Tomcat (300); resposta 5 s, sem retry
# (spec "Cliente"); identity fora => 503 genérico no /bff/** (IdentityIndisponivelHandler). O cadastro (código de 6 dígitos), o MFA e o
# reCAPTCHA são do identity.
identity.service.url=${IDENTITY_SERVICE_URL:http://localhost:8084}
identity.client.max-connections=${IDENTITY_CLIENT_MAX_CONNECTIONS:400}
identity.client.connect-timeout-ms=${IDENTITY_CLIENT_CONNECT_TIMEOUT_MS:2000}
identity.client.connection-request-timeout-ms=${IDENTITY_CLIENT_CONNECTION_REQUEST_TIMEOUT_MS:5000}
identity.client.response-timeout-ms=${IDENTITY_CLIENT_RESPONSE_TIMEOUT_MS:5000}
identity.client.evict-idle-ms=${IDENTITY_CLIENT_EVICT_IDLE_MS:20000}

# Caminho de leitura da reserva, decidido AQUI no gateway (EventWalletGateway): "cas" (default: UMA chamada ao reservation,
# CAS atômico lá dentro) ou "naive" (DUAS chamadas: GET da disponibilidade defasada e depois POST da reserva sem CAS — braço
# de controle do experimento; OVERSELLA de propósito). Lido na subida do monólito; trocável por env sem rebuild.
reservation.readpath=${RESERVATION_READPATH:cas}

# Serviço reservation (issue #33): API interna HTTP, só na rede gerenciador-net (http://reservation:8082 no compose).
# Cliente com pool de conexões dimensionado para a carga (ReservationClient): max-connections >= threads do Tomcat (300),
# senão a fila se forma no gateway e não no reservation; timeouts explícitos; evict-idle (20 s; conexão ociosa no máximo ~40 s) < keep-alive do servidor (60 s).
reservation.service.url=${RESERVATION_SERVICE_URL:http://localhost:8082}
# Token de serviço enviado (X-Internal-Token) em toda chamada ao reservation. SEM default: o monólito falha no boot se faltar
# (ReservationClient). O mesmo valor do reservation; Projeto/.env: INTERNAL_API_TOKEN=<openssl rand -hex 32>.
internal.api.token=${INTERNAL_API_TOKEN:}
reservation.client.max-connections=${RESERVATION_CLIENT_MAX_CONNECTIONS:400}
reservation.client.connect-timeout-ms=${RESERVATION_CLIENT_CONNECT_TIMEOUT_MS:2000}
reservation.client.connection-request-timeout-ms=${RESERVATION_CLIENT_CONNECTION_REQUEST_TIMEOUT_MS:5000}
reservation.client.response-timeout-ms=${RESERVATION_CLIENT_RESPONSE_TIMEOUT_MS:10000}
reservation.client.evict-idle-ms=${RESERVATION_CLIENT_EVICT_IDLE_MS:20000}

# Serviço catalog (issue #35): API interna HTTP /internal/events/** (http://catalog:8083 no compose), chamada pelo gateway pelo
# CatalogClient (lib catalog-client) com o mesmo INTERNAL_API_TOKEN. Pool >= threads do Tomcat (300); resposta 15 s, sem retry
# (spec "Pool"); catalog fora => 503 genérico no /bff/** (CatalogIndisponivelHandler).
catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8083}
catalog.client.max-connections=${CATALOG_CLIENT_MAX_CONNECTIONS:400}
catalog.client.connect-timeout-ms=${CATALOG_CLIENT_CONNECT_TIMEOUT_MS:2000}
catalog.client.connection-request-timeout-ms=${CATALOG_CLIENT_CONNECTION_REQUEST_TIMEOUT_MS:5000}
catalog.client.response-timeout-ms=${CATALOG_CLIENT_RESPONSE_TIMEOUT_MS:15000}
catalog.client.evict-idle-ms=${CATALOG_CLIENT_EVICT_IDLE_MS:20000}

# Serviço admission (issue #41): API interna HTTP /internal/admissions (http://admission:8085 no compose), chamada pelo gateway pelo
# AdmissionClient (lib admission-client) com o mesmo INTERNAL_API_TOKEN, UMA vez por POST /bff/event-wallets (nos dois braços), depois das
# validações e antes do reservation. FAIL-OPEN: admission fora/lento => a reserva segue síncrona, com log (no máximo 1 linha a cada 10 s).
# Timeouts curtos (o salto não pode custar mais que o sinal que traz); pool >= threads do Tomcat (300); sem retry. Disjuntor: 5 falhas
# seguidas abrem o circuito por ADMISSION_CLIENT_OPEN_MS (nada é chamado nesse tempo; depois uma chamada testa). O backend NÃO depende
# do admission no compose.
admission.service.url=${ADMISSION_SERVICE_URL:http://localhost:8085}
admission.client.max-connections=${ADMISSION_CLIENT_MAX_CONNECTIONS:400}
admission.client.connect-timeout-ms=${ADMISSION_CLIENT_CONNECT_TIMEOUT_MS:200}
admission.client.connection-request-timeout-ms=${ADMISSION_CLIENT_CONNECTION_REQUEST_TIMEOUT_MS:200}
admission.client.response-timeout-ms=${ADMISSION_CLIENT_RESPONSE_TIMEOUT_MS:500}
admission.client.evict-idle-ms=${ADMISSION_CLIENT_EVICT_IDLE_MS:20000}
admission.client.open-ms=${ADMISSION_CLIENT_OPEN_MS:5000}

# POST /bff/seed (dados de exemplo; rota pública que aceita creator_id/isAdmin do corpo): DESLIGADO por padrão (404, issue #35).
# Ligue só em dev/carga (carga/docker-compose.carga.yml passa SEED_ENABLED=true) e nos testes.
seed.enabled=${SEED_ENABLED:false}

# Backbone de eventos (issue #27, ADR Event-Backbone-Event-Store). Broker Kafka-compatível (Redpanda); no
# Docker é redpanda:9092 (SPRING_KAFKA_BOOTSTRAP_SERVERS no compose e no run-tests.sh). Só é usado quando o relay
# ou o consumer estão ligados (as flags events.*.enabled, desligadas por padrão). No compose o backend espera o
# Redpanda ficar healthy (depends_on), porque a #28/#29 ligam o relay; fora do compose (mvn spring-boot:run) o
# backend sobe sem broker enquanto as flags estiverem desligadas.
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Producer do relay: idempotente + acks=all (publicação at-least-once, sem duplicata por retry interno).
# max.block.ms/delivery.timeout.ms curtos: o relay segura uma conexão do pooler enquanto envia, então com o
# broker fora a transação falha em segundos em vez de ficar presa (delivery.timeout >= request.timeout + linger).
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000
# Consumer: ack manual depois do commit da projeção; offset só avança por ack. earliest (fixo): um group novo lê o
# log inteiro e não pula nada; o checkpoint por stream e a conferência do eventId descartam o que já foi aplicado
# ou sobrou de outro estado do banco. O @KafkaListener das projeções NÃO pode usar id= como group (idIsGroup=false),
# senão este group-id não vale.
spring.kafka.consumer.group-id=${EVENTS_CONSUMER_GROUP:gerenciador-eventos}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=manual
# Aplica as configs dos NewTopic também quando o tópico já existe (hoje só o identity.notification declara configs: a
# retenção curta do dado pessoal, #32); tópicos sem config declarada não são alterados.
spring.kafka.admin.modify-topic-configs=true

# Relay outbox -> broker. Desligado por padrão e DESLIGADO também no compose desde a #36: o monólito não appenda mais evento
# nenhum (o identity.notification passou ao serviço identity, que tem o event store e o relay próprios, como o catalog e o
# reservation). Os testes da infra (shared.events) ligam por @SpringBootTest(properties=...).
events.relay.enabled=${EVENTS_RELAY_ENABLED:false}
events.relay.interval-ms=${EVENTS_RELAY_INTERVAL_MS:50}
events.relay.batch-size=${EVENTS_RELAY_BATCH_SIZE:200}
# Consumer idempotente (listeners das projeções assíncronas). O monólito não tem projeção assíncrona desde a #33 (a de
# disponibilidade é do serviço reservation); a flag e o resto ficam para os testes da infra (shared.events). Erro transitório (banco/conexão): retry exponencial
# sem limite, nunca DLT. Buraco irrecuperável no stream: max-attempts retries a cada interval-ms e depois
# <tópico>.DLT. Payload inválido: DLT direto.
events.consumer.enabled=${EVENTS_CONSUMER_ENABLED:false}
events.consumer.retry.interval-ms=${EVENTS_CONSUMER_RETRY_INTERVAL_MS:1000}
events.consumer.retry.max-attempts=${EVENTS_CONSUMER_RETRY_MAX_ATTEMPTS:5}
# O retry transitório é ilimitado: a partir desta tentativa (de uma mesma mensagem) cada falha loga em ERROR.
events.consumer.retry.error-after-attempts=${EVENTS_CONSUMER_RETRY_ERROR_AFTER_ATTEMPTS:10}
# Tamanho máximo do lote do listener da projeção de disponibilidade (#146): vira o max.poll.records só dele; cada
# lote é uma transação de banco e um ack. Com o consumer em dia o lote tem poucos registros; atrasado, chega a este teto.
events.consumer.batch-size=${EVENTS_CONSUMER_BATCH_SIZE:500}
# Snapshot de stream a cada N eventos (cache descartável; N alto de propósito).
events.snapshot.every=${EVENTS_SNAPSHOT_EVERY:100}

# Pool do scheduler dos @Scheduled. O default do Boot é 1 thread; o relay (que ocupa uma thread enquanto houver outbox) só roda aqui
# nos testes da infra shared.events (a retenção do identity.notification e o relay de produção são do serviço identity, #36).
spring.task.scheduling.pool.size=${SPRING_TASK_SCHEDULING_POOL_SIZE:3}

# Balanceamento no cliente (trilha C do Kubernetes, issue #197): DNS round-robin + TTL de conexao + reuso FIFO nos clientes HTTP deste servico.
# Desligado por padrao (a montagem dos clientes e a de sempre); o overlay k8s/overlays/trilha-c liga e aponta os *_SERVICE_URL para os Services headless.
client.lb.enabled=${CLIENT_LB_ENABLED:false}
client.lb.ttl-ms=${CLIENT_LB_TTL_MS:15000}
