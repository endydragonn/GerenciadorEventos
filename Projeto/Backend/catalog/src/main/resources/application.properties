# Serviço catalog (issue #35, Fase 7): eventos em CQRS + event sourcing (stream catalog.event) + API interna HTTP chamada pelo
# gateway do monólito. Variáveis de ambiente com os MESMOS nomes que o monólito usava para o que veio de lá
# (SPRING_DATASOURCE_*, SERVER_TOMCAT_THREADS_MAX, EVENTS_*, RESERVATION_*); valores reais em Projeto/.env (nunca imprimir).
spring.application.name=catalog
server.port=8083

# Banco: no Docker, pelo Supavisor (SPRING_DATASOURCE_URL do compose); local, direto em localhost:5433.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/meu_banco?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:senha123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool (spec "Pool"): Hikari 100 => 1000 (reservation) + 350 (monólito) + 3 (notification) + 100 (catalog) = 1453 <=
# POOLER_MAX_CLIENT_CONN 1500 (mesmo tenant/usuário do Supavisor: o pool real ao Postgres não cresce). connection-timeout 5 s:
# esperar conexão mais que isso só empilha requisições atrás do timeout de 15 s do gateway. Tomcat 300 como os outros serviços.
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:100}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:5000}
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:300}
# Keep-alive como no reservation: sem teto de requisições por conexão e timeout (60 s) MAIOR que o evict-idle do cliente (20 s).
server.tomcat.max-keep-alive-requests=${SERVER_TOMCAT_MAX_KEEP_ALIVE_REQUESTS:-1}
server.tomcat.keep-alive-timeout=${SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT:60s}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Token de serviço que autentica as chamadas internas (header X-Internal-Token em toda requisição; 401 sem/errado). SEM default:
# o serviço falha no boot sem INTERNAL_API_TOKEN (InternalTokenFilter). É também o token que este serviço envia ao reservation.
internal.api.token=${INTERNAL_API_TOKEN:}

# Cliente do serviço reservation (eventcap: PUT/PATCH/batch/DELETE /internal/eventcaps). Mesmos nomes e defaults do monólito;
# pool menor que o do gateway (o catalog não está no caminho quente da reserva).
reservation.service.url=${RESERVATION_SERVICE_URL:http://localhost:8082}
reservation.client.max-connections=${RESERVATION_CLIENT_MAX_CONNECTIONS:100}
reservation.client.connect-timeout-ms=${RESERVATION_CLIENT_CONNECT_TIMEOUT_MS:2000}
reservation.client.connection-request-timeout-ms=${RESERVATION_CLIENT_CONNECTION_REQUEST_TIMEOUT_MS:5000}
reservation.client.response-timeout-ms=${RESERVATION_CLIENT_RESPONSE_TIMEOUT_MS:10000}
reservation.client.evict-idle-ms=${RESERVATION_CLIENT_EVICT_IDLE_MS:20000}

# Event store DESTE serviço: schema catalog (event_store, event_outbox, event_snapshot, projection_checkpoint e a projeção
# inline event/eventpresenter). Nenhum serviço lê tabela de outro.
events.schema=catalog

# Backbone: o relay publica o stream catalog.event no tópico catalog.event (o reservation reconcilia o eventcap pelo EventCreated).
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000

# Relay outbox -> broker: desligado por padrão, como no reservation (os testes que olham o outbox precisam dele parado); o compose
# liga (EVENTS_RELAY_ENABLED=true). O catalog NÃO tem projeção assíncrona: consumer sempre desligado (sem env de propósito).
events.relay.enabled=${EVENTS_RELAY_ENABLED:false}
events.relay.interval-ms=${EVENTS_RELAY_INTERVAL_MS:50}
events.relay.batch-size=${EVENTS_RELAY_BATCH_SIZE:200}
events.consumer.enabled=false
events.snapshot.every=${EVENTS_SNAPSHOT_EVERY:100}

# Pool do scheduler dos @Scheduled (aqui só o relay).
spring.task.scheduling.pool.size=${SPRING_TASK_SCHEDULING_POOL_SIZE:3}

# Sem Spring Security, sem actuator: a API interna só é alcançável na rede gerenciador-net (sem porta no host).
