# Serviço identity (issue #36, Fase 7): usuários, carteira (mywallet), cadastro em duas fases, MFA, reCAPTCHA e emissão do JWT
# (RS256 + JWKS) + API interna HTTP chamada pelo gateway do monólito. Variáveis de ambiente com os MESMOS nomes que o monólito
# usava para o que veio de lá (SPRING_DATASOURCE_*, JWT_EXPIRATION_SECONDS, RECAPTCHA_SECRET_KEY, EVENTS_*); valores reais em
# Projeto/.env (nunca imprimir). JWT_SECRET deixou de existir (o JWT é assimétrico).
spring.application.name=identity
server.port=8084

# Banco: no Docker, pelo Supavisor (SPRING_DATASOURCE_URL do compose); local, direto em localhost:5433.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/meu_banco?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:senha123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool (spec "Pool"): Hikari 100 => 1000 (reservation) + 10 (gateway, depois do cutover) + 3 (notification) + 100 (catalog) + 100
# (identity) = 1213 (1463 com os 250 do stock, #47) <= POOLER_MAX_CLIENT_CONN 1500 (mesmo tenant/usuário do Supavisor: o pool real ao Postgres não cresce).
# connection-timeout 5 s: esperar conexão mais que isso só empilha requisições atrás do timeout do gateway. Tomcat 300 como os
# outros serviços; virtual threads desligadas (padrão).
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:100}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:5000}
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:300}
# Keep-alive como no reservation/catalog: sem teto de requisições por conexão e timeout (60 s) MAIOR que o evict-idle do cliente (20 s).
server.tomcat.max-keep-alive-requests=${SERVER_TOMCAT_MAX_KEEP_ALIVE_REQUESTS:-1}
server.tomcat.keep-alive-timeout=${SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT:60s}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Token de serviço que autentica as chamadas internas (header X-Internal-Token em toda requisição, menos o GET do JWKS; 401
# sem/errado). SEM default: o serviço falha no boot sem INTERNAL_API_TOKEN (InternalTokenFilter).
internal.api.token=${INTERNAL_API_TOKEN:}

# JWT (RS256). A chave (JWK privada + pública) é gerada no 1º boot e persistida neste arquivo (volume identity-keys no compose;
# sobrevive a restart/rebuild). Arquivo ilegível ou corrompido = falha no boot (nunca regera por cima: os tokens válidos sumiriam em
# silêncio). Rotação = apagar o arquivo e reiniciar. exp = JWT_EXPIRATION_SECONDS (36000 = 10 h).
jwt.signing-key-path=${JWT_SIGNING_KEY_PATH:/var/lib/identity/jwt-signing-key.json}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:36000}
jwt.issuer=gerenciador-identity

# reCAPTCHA v3: a chave é só deste serviço. recaptcha.verify-url é property para o teste apontar para um fake local.
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
recaptcha.verify-url=${RECAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}
recaptcha.score-threshold=0.7

# Cadastro em duas fases (código de 6 dígitos, 5 min, 5 tentativas)
verification.code.length=6
verification.code.expiration.minutes=5
verification.code.max.attempts=5

# Event store DESTE serviço: schema identity (event_store, event_outbox, event_snapshot, projection_checkpoint). Guarda o stream
# identity.notification (pedido de e-mail; contrato e tópico congelados) e o identity.user (ciclo de vida, payload só com ids).
events.schema=identity

# Backbone: o relay publica os streams no tópico de mesmo nome (o notification consome o identity.notification).
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000
# Aplica as configs dos NewTopic também quando o tópico já existe (a retenção curta do identity.notification, #32).
spring.kafka.admin.modify-topic-configs=true

# Relay outbox -> broker: desligado por padrão (os testes que olham o outbox precisam dele parado); o compose liga
# (EVENTS_RELAY_ENABLED=true). O identity NÃO consome tópico: consumer sempre desligado (sem env de propósito).
events.relay.enabled=${EVENTS_RELAY_ENABLED:false}
events.relay.interval-ms=${EVENTS_RELAY_INTERVAL_MS:50}
events.relay.batch-size=${EVENTS_RELAY_BATCH_SIZE:200}
events.consumer.enabled=false
events.snapshot.every=${EVENTS_SNAPSHOT_EVERY:100}

# Retenção do dado pessoal do stream identity.notification no event_store (#32): apaga as linhas cujo código venceu há mais de
# 30 s (NotificationEvents.CARENCIA) e que já saíram do outbox. A validade vem do próprio evento (payload.expiresAt).
notification.events.retention.scan.ms=${NOTIFICATION_EVENTS_RETENTION_SCAN_MS:30000}

# Pool do scheduler dos @Scheduled (o relay e a retenção). O default do Boot é 1 thread: o relay ocupa uma enquanto houver outbox.
spring.task.scheduling.pool.size=${SPRING_TASK_SCHEDULING_POOL_SIZE:3}

# Sem Spring Security: a API interna só é alcançável na rede gerenciador-net (sem porta no host).
# Actuator (issue #197): o HTTP de management fica DESLIGADO (-1) e o compose não muda. O manifest do Kubernetes liga a porta própria
# (MANAGEMENT_SERVER_PORT=8090, outro conector e outro pool de threads que a API) só para as probes de /actuator/health/{liveness,readiness};
# só `health`, sem detalhes. O filtro do X-Internal-Token é do contexto da API e não vale na porta de management.
management.server.port=-1
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Sem o timer por requisição (observação http.server.requests) no caminho quente; o Micrometer do actuator segue com os binders de JVM/Hikari/Tomcat e a observação dos @Scheduled.
management.observations.enable.http.server.requests=false
