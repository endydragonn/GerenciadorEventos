# Serviço stock (issue #47, saga stock + wallet): eventcap (CAS) + ledger de holds (stock.hold) + API interna HTTP chamada pelo
# reservation (orquestrador da saga) e pelo catalog (capacidade). As variáveis de ambiente têm os MESMOS nomes dos outros serviços
# (SPRING_DATASOURCE_*, SERVER_TOMCAT_THREADS_MAX, EVENTS_*); valores reais em Projeto/.env (nunca imprimir).
spring.application.name=stock
server.port=8086

# Banco: no Docker, pelo Supavisor (SPRING_DATASOURCE_URL do compose); local, direto em localhost:5433.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/meu_banco?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:senha123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Mesma configuração do caminho quente do reservation: Tomcat 300, virtual threads DESLIGADAS (padrão). Hikari 250 ~ o pool real de 245 do
# Supavisor na configuração de carga (conta do Supavisor no Backend/CLAUDE.md). No compose o valor é um LITERAL (nunca a variável do reservation).
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:250}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:300}
# O reservation reaproveita as conexões HTTP (keep-alive): sem limite de requisições por conexão, e o keep-alive do servidor (60 s) maior que o
# evict-idle do cliente (20 s), para o cliente fechar a ociosa antes do servidor e nunca pegar um socket já fechado.
server.tomcat.max-keep-alive-requests=${SERVER_TOMCAT_MAX_KEEP_ALIVE_REQUESTS:-1}
server.tomcat.keep-alive-timeout=${SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT:60s}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Token de serviço das chamadas internas (header X-Internal-Token em TODA requisição; 401 sem/errado). SEM valor default de propósito:
# o serviço falha no boot se INTERNAL_API_TOKEN faltar (InternalTokenFilter).
internal.api.token=${INTERNAL_API_TOKEN:}

# O stock NÃO tem event store nem relay (só consome). events.schema só existe porque a lib shared declara o EventStore.
events.schema=stock

# Backbone: broker Kafka-compatível (Redpanda). Os dois consumers do serviço têm group próprio (abaixo); o spring.kafka.consumer.group-id
# é só o default do container.
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.consumer.group-id=${EVENTS_CONSUMER_GROUP:stock}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=manual

# Política de erro/DLT dos consumers (shared.EventsKafkaConfig): erro transitório = retry sem limite, sem avançar o offset. Os dois consumers
# abaixo só ligam com events.consumer.enabled=true; sem essa política o handler padrão do Spring pularia a mensagem depois de poucas
# tentativas e uma devolução de vaga se perderia em silêncio.
events.consumer.enabled=${EVENTS_CONSUMER_ENABLED:false}
events.consumer.retry.interval-ms=${EVENTS_CONSUMER_RETRY_INTERVAL_MS:1000}
events.consumer.retry.max-attempts=${EVENTS_CONSUMER_RETRY_MAX_ATTEMPTS:5}
events.consumer.retry.error-after-attempts=${EVENTS_CONSUMER_RETRY_ERROR_AFTER_ATTEMPTS:10}
events.consumer.batch-size=${EVENTS_CONSUMER_BATCH_SIZE:500}

# Devolução da vaga ao cancelar/expirar (StockReleaseConsumer): consome ReservationCancelled/ReservationExpired do tópico reservation.wallet
# e libera o hold (idempotente por holdId). Desligado por padrão (os testes ligam com group e tópico próprios); o compose liga.
# auto.offset.reset=earliest fixo no listener: com latest, um cancelamento publicado antes da 1ª atribuição do group seria pulado.
stock.release-consumer.enabled=${STOCK_RELEASE_CONSUMER_ENABLED:false}
stock.release-consumer.group=${STOCK_RELEASE_CONSUMER_GROUP:stock}
stock.release-consumer.topic=${STOCK_RELEASE_CONSUMER_TOPIC:reservation.wallet}

# Reconciliação do eventcap pelo EventCreated do tópico catalog.event (CatalogReconciliationConsumer). Desligada por padrão; o compose liga.
# Group próprio, sempre latest.
stock.catalog-reconciliation.enabled=${STOCK_CATALOG_RECONCILIATION_ENABLED:false}
stock.catalog-reconciliation.group=${STOCK_CATALOG_RECONCILIATION_GROUP:stock-catalog}

# Sem Spring Security: a API interna só é alcançável na rede gerenciador-net (sem porta no host).
# Actuator (issue #197): o HTTP de management fica DESLIGADO (-1) e o compose não muda. O manifest do Kubernetes liga a porta própria
# (MANAGEMENT_SERVER_PORT=8090, outro conector e outro pool de threads que a API) só para as probes de /actuator/health/{liveness,readiness};
# só `health`, sem detalhes. O filtro do X-Internal-Token é do contexto da API e não vale na porta de management.
management.server.port=-1
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Sem o timer por requisição (observação http.server.requests) no caminho quente; o Micrometer do actuator segue com os binders de JVM/Hikari/Tomcat e a observação dos @Scheduled.
management.observations.enable.http.server.requests=false
