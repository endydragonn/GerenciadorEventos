# Serviço reservation (issue #33, Fase 7; lado wallet da saga stock + wallet, #47): walletevent (event sourcing) + API interna HTTP chamada pelo
# gateway do monólito. As variáveis de ambiente têm os MESMOS nomes que o monólito usava para o que veio de lá
# (SPRING_DATASOURCE_*, SERVER_TOMCAT_THREADS_MAX, EVENTS_*, IDEMPOTENCY_*); valores reais em Projeto/.env (nunca imprimir).
spring.application.name=reservation
server.port=8082

# Banco: no Docker, pelo Supavisor (SPRING_DATASOURCE_URL do compose); local, direto em localhost:5433.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/meu_banco?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:senha123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do CAMINHO QUENTE do experimento, a mesma que o monólito tinha no ponto 2: Tomcat 300, Hikari 1000, virtual
# threads DESLIGADAS (padrão; não há spring.threads.virtual.enabled). Mexer aqui quebra a comparabilidade com a Rodada 2 e
# muda a conta do pool do Supavisor (Backend/CLAUDE.md, "Serviço reservation").
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:1000}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:300}
# O gateway reaproveita as conexões HTTP (keep-alive). O Tomcat fecha a conexão depois de 100 requisições por padrão: sob
# carga isso viraria reconexão contínua (e fila de accept) no salto que a Rodada 3 mede. -1 = sem limite. O keep-alive-timeout
# (padrão = connectionTimeout, 20 s) tem de ser MAIOR que o evict-idle do cliente (reservation.client.evict-idle-ms = 20 s no
# monólito): o cliente fecha a conexão ociosa antes do servidor, nunca pega um socket já fechado.
server.tomcat.max-keep-alive-requests=${SERVER_TOMCAT_MAX_KEEP_ALIVE_REQUESTS:-1}
server.tomcat.keep-alive-timeout=${SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT:60s}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Token de serviço que autentica as chamadas internas do gateway (header X-Internal-Token em todo /internal/**; 401 sem/errado).
# SEM valor default de propósito: o serviço falha no boot se INTERNAL_API_TOKEN faltar (InternalTokenFilter). O Projeto/.env precisa
# de INTERNAL_API_TOKEN=<valor aleatório>, ex.: openssl rand -hex 32; o compose repassa o MESMO valor ao backend.
internal.api.token=${INTERNAL_API_TOKEN:}

# Event store DESTE serviço: schema reservation (event_store, event_outbox, event_snapshot, projection_checkpoint e as
# projeções vivas). Nenhum serviço lê tabela de outro. O monólito mantém o dele em public (default).
events.schema=reservation

# Backbone: broker Kafka-compatível (Redpanda). Group PRÓPRIO do serviço para a projeção de disponibilidade (no monólito era
# gerenciador-eventos); o EVENTS_CONSUMER_GROUP do run-tests.sh dá aos testes um group isolado.
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.consumer.group-id=${EVENTS_CONSUMER_GROUP:reservation}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=manual

# Relay outbox -> broker e consumer da projeção de disponibilidade: desligados por padrão (os testes ligam por
# @SpringBootTest(properties=...)); o compose liga os dois.
events.relay.enabled=${EVENTS_RELAY_ENABLED:false}
events.relay.interval-ms=${EVENTS_RELAY_INTERVAL_MS:50}
events.relay.batch-size=${EVENTS_RELAY_BATCH_SIZE:200}
events.consumer.enabled=${EVENTS_CONSUMER_ENABLED:false}
events.consumer.retry.interval-ms=${EVENTS_CONSUMER_RETRY_INTERVAL_MS:1000}
events.consumer.retry.max-attempts=${EVENTS_CONSUMER_RETRY_MAX_ATTEMPTS:5}
events.consumer.retry.error-after-attempts=${EVENTS_CONSUMER_RETRY_ERROR_AFTER_ATTEMPTS:10}
events.consumer.batch-size=${EVENTS_CONSUMER_BATCH_SIZE:500}
events.snapshot.every=${EVENTS_SNAPSHOT_EVERY:100}

# Saga stock + wallet (#47). A espera por outra saga da MESMA chave em reserving fica ABAIXO do timeout de resposta dos chamadores
# (gateway e worker do admission, 10 s): senão a thread do Tomcat seguiria presa depois que o chamador desistiu.
reservation.saga.wait-ms=${RESERVATION_SAGA_WAIT_MS:8000}

# Reaper das sagas órfãs (#47, SagaReaperService): a cada SCAN_MS procura sagas reserving paradas há mais de ORPHAN_MS (acima de pool 5 s +
# resposta 10 s do cliente do stock + margem) e as compensating com a mesma idade, e libera o hold no stock. Liga por padrão; os testes que não são do
# reaper o desligam (surefire). reservation.saga.failpoint (só de teste, vazio em produção, SEM variável no compose): "after-hold" interrompe
# o pedido logo depois do hold, sem compensar e sem tx2.
reservation.saga.reaper.enabled=${RESERVATION_SAGA_REAPER_ENABLED:true}
reservation.saga.reaper.scan-ms=${RESERVATION_SAGA_REAPER_SCAN_MS:5000}
reservation.saga.reaper.batch=${RESERVATION_SAGA_REAPER_BATCH:100}
reservation.saga.orphan-ms=${RESERVATION_SAGA_ORPHAN_MS:30000}

# Cliente do serviço stock (#47): o salto reservation -> stock (POST /internal/holds e /release) e a leitura da capacidade (disponibilidade
# do braço naive). Pool >= o Tomcat deste serviço (300; a regra gateway -> reservation), conectar 2 s, pool 5 s, resposta 10 s, evict 20 s
# (< o keep-alive de 60 s do stock), sem retry. O token é o internal.api.token acima (o mesmo valor em todos os serviços).
stock.service.url=${STOCK_SERVICE_URL:http://localhost:8086}
stock.client.max-connections=${STOCK_CLIENT_MAX_CONNECTIONS:400}
stock.client.connect-timeout-ms=${STOCK_CLIENT_CONNECT_TIMEOUT_MS:2000}
stock.client.connection-request-timeout-ms=${STOCK_CLIENT_CONNECTION_REQUEST_TIMEOUT_MS:5000}
stock.client.response-timeout-ms=${STOCK_CLIENT_RESPONSE_TIMEOUT_MS:10000}
stock.client.evict-idle-ms=${STOCK_CLIENT_EVICT_IDLE_MS:20000}

# Jobs agendados: expiração de reservas pending e retenção das chaves de idempotência (#130).
reservation.expiry.scan.ms=${RESERVATION_EXPIRY_SCAN_MS:30000}
reservation.expiry.batch-size=${RESERVATION_EXPIRY_BATCH_SIZE:100}
idempotency.retention.hours=${IDEMPOTENCY_RETENTION_HOURS:24}
idempotency.retention.scan.ms=${IDEMPOTENCY_RETENTION_SCAN_MS:600000}

# Pool do scheduler dos @Scheduled (relay, expiração, retenção e o reaper da saga, o único com HTTP: um stock travado prende a thread dele). O default do Boot é 1 thread; o relay ocupa uma enquanto
# houver outbox e um purge em massa seguraria o relay e falsearia o lag medido do braço naive.
spring.task.scheduling.pool.size=${SPRING_TASK_SCHEDULING_POOL_SIZE:4}

# Sem Spring Security: a API interna só é alcançável na rede gerenciador-net (sem porta no host).
# Actuator (issue #197): o HTTP de management fica DESLIGADO (-1) e o compose não muda. O manifest do Kubernetes liga a porta própria
# (MANAGEMENT_SERVER_PORT=8090, outro conector e outro pool de threads que a API) só para as probes de /actuator/health/{liveness,readiness};
# só `health`, sem detalhes. O filtro do X-Internal-Token é do contexto da API e não vale na porta de management.
management.server.port=-1
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Sem o timer por requisição (observação http.server.requests) no caminho quente; o Micrometer do actuator segue com os binders de JVM/Hikari/Tomcat e a observação dos @Scheduled.
management.observations.enable.http.server.requests=false

# Balanceamento no cliente (trilha C do Kubernetes, issue #197): DNS round-robin + TTL de conexao + reuso FIFO nos clientes HTTP deste servico.
# Desligado por padrao (a montagem dos clientes e a de sempre); o overlay k8s/overlays/trilha-c liga e aponta os *_SERVICE_URL para os Services headless.
client.lb.enabled=${CLIENT_LB_ENABLED:false}
client.lb.ttl-ms=${CLIENT_LB_TTL_MS:15000}
