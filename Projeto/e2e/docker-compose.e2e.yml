# Override da suíte e2e (issue #37), usado SÓ por e2e/run-e2e.sh:
#   docker compose -p gerenciador-e2e -f docker-compose.yml -f e2e/docker-compose.e2e.yml up -d --build --wait
# (os 7 serviços Java rodam as imagens slim do base, ou as completas com E2E_COMPLETA=1: ver o cabeçalho do run-e2e.sh)
# Sobe a stack inteira num project TEMPORÁRIO, isolado da stack real e sem mandar e-mail de verdade. Não altera nenhum default do
# compose normal. O isolamento é conferido pelo run-e2e.sh (`config`) ANTES do `up`.

services:
  # Nenhum container_name fixo (dois projects com o mesmo nome de container não coexistem) e nenhuma porta publicada no host
  # (8081, 8088, 5433, 8000 são da stack real). Vale também para os serviços dos includes do Supabase.
  db: &isolado
    container_name: !reset null
    ports: !reset []
  redpanda: *isolado
  backend: *isolado
  identity: *isolado
  catalog: *isolado
  # Saga stock + wallet (#47): o reaper e a janela de órfã CURTOS (o run-e2e.sh exporta SAGA_ORPHAN_MS/SAGA_SCAN_MS, default 5000/1000; o validador exige
  # ORPHAN_MS entre 1000 e 10000), para os passos (a) stock fora e (b) queda do reservation esperarem segundos, não os 35 s do default.
  reservation:
    <<: *isolado
    environment:
      RESERVATION_SAGA_ORPHAN_MS: ${SAGA_ORPHAN_MS:-5000}
      RESERVATION_SAGA_REAPER_SCAN_MS: ${SAGA_SCAN_MS:-1000}
  # stock e stock-seek (#47): sem container_name nem porta no host, como os demais (o stock só fala na rede do project).
  stock: *isolado
  stock-seek: *isolado
  # Redis e admission (issue #41): sem container_name nem porta no host, como os demais. A senha do Redis do project temporário é
  # efêmera (o run-e2e.sh exporta REDIS_PASSWORD, nunca a do Projeto/.env); o Redis não tem volume nem persistência.
  redis: *isolado
  # RabbitMQ (issue #42): a fila de admissão. Sem container_name nem porta no host; usuário e senha EFÊMEROS (o run-e2e.sh exporta
  # RABBITMQ_USER e RABBITMQ_PASSWORD, nunca os do Projeto/.env); sem volume (tmpfs no compose base).
  rabbitmq: *isolado
  # Gatilho do modo fila (#43): X BAIXO no e2e (o run-e2e.sh exporta ADMISSION_X_RPM, default 600; o validador exige 500..5000). 80% de X = 480
  # RPM: a reserva isolada do passo 4 (uma tentativa le no maximo ~397 RPM) segue sincrona, e a rajada do passo 4b ultrapassa o limiar e liga
  # o modo fila. Os demais valores do admission ficam os do compose base.
  admission:
    <<: *isolado
    environment:
      ADMISSION_X_RPM: ${ADMISSION_X_RPM:-600}
  notification-seek: *isolado
  frontend: *isolado
  supabase-pooler: *isolado
  meta: *isolado
  kong: *isolado

  # O Studio da stack real monta ./supabase/volumes/snippets (gravável) do host: o project temporário não pode escrever lá.
  # Pasta de snippets em tmpfs (descartável).
  studio:
    <<: *isolado
    volumes: !reset []
    tmpfs:
      - /app/snippets

  # Captador de e-mail: SMTP 1025 e API/UI 8025, só na rede do project. Imagem fixada.
  mailpit:
    image: axllent/mailpit:v1.31.6
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"

  # O e-mail do cadastro vai para o captador, não para o Gmail: sem auth, sem STARTTLS, sem senha. O MAIL_USERNAME NÃO pode ficar
  # vazio: o serviço o usa como remetente (From) e o captador recusa remetente vazio (SMTP rejeitaria o destinatário e o evento iria
  # para o DLT); sem auth ele não é credencial de nada.
  notification:
    <<: *isolado
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS: "false"
      MAIL_USERNAME: e2e-notification@example.com
      MAIL_PASSWORD: ""
    depends_on:
      mailpit:
        condition: service_healthy

networks:
  # Sem o nome fixo gerenciador-net: a rede passa a ser <project>_default. Na rede real, `db`, `redpanda` e `supabase-pooler`
  # resolveriam para os containers REAIS (o project temporário escreveria no meu_banco de verdade).
  default:
    name: !reset null
