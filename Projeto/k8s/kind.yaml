# Cluster kind principal (issue #197): um nó control-plane, imagem do kind v0.33.0 fixada por digest.
# Gateway (NodePort 30081) e frontend (NodePort 30088) saem no host em 8081 e 8088 (0.0.0.0: o gerador de carga da rede local chega na
# 8081 como no compose). O contrato do Flutter (porta e paths) não muda. O nome do cluster vem do `cluster.sh` (--name), não daqui.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 30081
        hostPort: 8081
        listenAddress: "0.0.0.0"
        protocol: TCP
      - containerPort: 30088
        hostPort: 8088
        listenAddress: "0.0.0.0"
        protocol: TCP
      # API do Mailpit do overlay `soak` (#232): NodePort 30825 -> host 8025. Publicada em 0.0.0.0 em TODO cluster criado com este arquivo, mas só tem Service por trás no `soak`
      # (nos demais o Docker abre a porta e a conexão é recusada). Quem a expõe de verdade é a regra de firewall do Windows restrita ao IP do gerador (Projeto/carga/soak/firewall-mailpit.ps1).
      # Mudar isto exige RECRIAR o cluster (`cluster.sh down` + `up`): o kind não altera portas de um nó existente.
      - containerPort: 30825
        hostPort: 8025
        listenAddress: "0.0.0.0"
        protocol: TCP
