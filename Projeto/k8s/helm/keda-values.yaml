# Valores do chart `keda` (kedacore/keda 2.21.0, publicado em 2026-09-23) no cluster.sh (issue #197, etapa 4). Só o que difere do padrão.
# P3: o KEDA NÃO lê Secret do cluster inteiro. `permissions.*.restrict.secret=true` põe KEDA_RESTRICT_SECRET_ACCESS=true no operador e no metrics-apiserver
# (conferido com `helm template`): eles só leem Secrets do namespace do próprio KEDA (`keda`), onde mora o token SÓ de métrica da ClusterTriggerAuthentication.
# (O nome do value no chart é permissions.operator.restrict.secret, não `restrictSecretAccess`.)
permissions:
  operator:
    restrict:
      secret: true
  metricServer:
    restrict:
      secret: true
