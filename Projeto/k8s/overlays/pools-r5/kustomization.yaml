# Componente `pools-r5` (issue #228): os pools de REPLICA UNICA da Rodada 5 (bloco 1, compose), para os blocos K0/K1 da rodada com o db remoto compararem com o compose. O `cluster.sh up` o soma quando
# K8S_POOLS=r5 e só com a autoescala travada em 1 (K8S_<SVC>_MAX=1, o padrão com K8S_POOLS=r5; o `cluster.sh` recusa MAX > 1). Valores = os do docker-compose.yml (+ carga/docker-compose.carga.yml):
#   Hikari: reservation 1000, stock 250, identity 100, catalog 100, backend 10, notification 3; workers do admission 32 (ADMISSION_WORKER_CONCURRENCY, o default do compose).
# Soma no Supavisor: 1000 + 250 + 100 + 100 + 10 + 3 = 1463 <= POOLER_MAX_CLIENT_CONN 1500, com 1 réplica de cada e maxSurge 0 (sem pod extra no rollout; o stock, `Recreate`). Com réplicas a conta estouraria:
# o K2 (autoescala 1..3) NÃO usa este componente e segue com os pools do cluster (stock 245, 1 réplica fixa: 4×200 + 4×10 + 4×3 + 4×50 + 4×50 + 245 = 1497, #231). O stock aqui fica em 250 (réplica única, como no compose). O pool real do Supavisor (245) e o max_connections do db vêm do overlay `rodada`.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: {kind: Deployment, name: reservation}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: reservation}
      spec: {template: {spec: {containers: [{name: reservation, env: [{name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE, value: "1000"}]}]}}}
  - target: {kind: Deployment, name: stock}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: stock}
      spec: {template: {spec: {containers: [{name: stock, env: [{name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE, value: "250"}]}]}}}
  - target: {kind: Deployment, name: identity}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: identity}
      spec: {template: {spec: {containers: [{name: identity, env: [{name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE, value: "100"}]}]}}}
  - target: {kind: Deployment, name: catalog}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: catalog}
      spec: {template: {spec: {containers: [{name: catalog, env: [{name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE, value: "100"}]}]}}}
  - target: {kind: Deployment, name: backend}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: backend}
      spec: {template: {spec: {containers: [{name: backend, env: [{name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE, value: "10"}]}]}}}
  - target: {kind: Deployment, name: notification}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: notification}
      spec: {template: {spec: {containers: [{name: notification, env: [{name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE, value: "3"}]}]}}}
  - target: {kind: Deployment, name: admission}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: admission}
      spec: {template: {spec: {containers: [{name: admission, env: [{name: ADMISSION_WORKER_CONCURRENCY, value: "32"}]}]}}}
