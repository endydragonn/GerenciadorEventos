# Autoescala (issue #197, D5 = a, KEDA sem Prometheus): um ScaledObject por serviço Java escalável (os 6; o `stock` NÃO tem, #231); o KEDA cria o HPA (`keda-hpa-<nome>`). Valores PADRÃO aqui; o cluster.sh gera
# o patch (kustomization temporário) com K8S_<SVC>_MIN/_MAX (default 1/3; admission 2/3, #235), K8S_DESCE_SEG (120), K8S_CPU_ALVO (50), o alvo do reservation (0,5 x ADMISSION_X_RPM, da MESMA
# variável que o admission recebe) e o lagThreshold do notification (0,5 x AUTOESCALA_NOTIFICATION_LAG). Sem escala a zero.
#  - reservation: metrics-api em GET /internal/metrics/hot do admission (o adm:hot, RPM do evento mais quente), com o token SÓ de métrica (ClusterTriggerAuthentication
#    admission-metrics, criada pelo cluster.sh): réplicas = ceil(RPM / (0,5 x X)). Sem a chave o endpoint devolve 0 (nunca 404: o KEDA, em erro, congela as réplicas).
#  - notification: kafka, lag do group `notification` em identity.notification, allowIdleConsumers=false (no máximo uma réplica por partição lida). O bootstrap usa o FQDN;
#    o broker anuncia `redpanda:9092`, que o cluster.sh resolve no namespace keda com um Service ExternalName.
#  - backend, identity, catalog, admission: cpu Utilization 50 só do container da aplicação (containerName: o sidecar da trilha B1 não entra na conta).
#  - stock: FORA da autoescala (#231): 1 réplica fixa no Deployment (`replicas: 1`, `Recreate`, Hikari 245), sem ScaledObject; ver base/stock.yaml.
# Descida suavizada (#206): janela de estabilização (o HPA desce para a MAIOR recomendação dela) e no máximo 1 pod por 60 s; subida sem janela, 1 pod por 15 s.
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: reservation
  labels: {app: reservation}
spec:
  scaleTargetRef: {name: reservation}
  pollingInterval: 5
  minReplicaCount: 1
  maxReplicaCount: 3
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
            - {type: Pods, value: 1, periodSeconds: 60}
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - {type: Pods, value: 1, periodSeconds: 15}
  triggers:
    - type: metrics-api
      metricType: AverageValue
      metadata:
        url: "http://admission.gerenciador.svc.cluster.local:8085/internal/metrics/hot"
        valueLocation: "rpm"
        targetValue: "28000"
        method: "header"
        authMode: "apiKey"
        keyParamName: "X-Internal-Token"
      authenticationRef:
        name: admission-metrics
        kind: ClusterTriggerAuthentication
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notification
  labels: {app: notification}
spec:
  scaleTargetRef: {name: notification}
  pollingInterval: 5
  minReplicaCount: 1
  maxReplicaCount: 3
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
            - {type: Pods, value: 1, periodSeconds: 60}
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - {type: Pods, value: 1, periodSeconds: 15}
  triggers:
    - type: kafka
      metricType: AverageValue
      metadata:
        bootstrapServers: "redpanda.gerenciador.svc.cluster.local:9092"
        consumerGroup: "notification"
        topic: "identity.notification"
        lagThreshold: "50"
        allowIdleConsumers: "false"
        offsetResetPolicy: "latest"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: backend
  labels: {app: backend}
spec:
  scaleTargetRef: {name: backend}
  pollingInterval: 5
  minReplicaCount: 1
  maxReplicaCount: 3
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
            - {type: Pods, value: 1, periodSeconds: 60}
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - {type: Pods, value: 1, periodSeconds: 15}
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "50"
        containerName: "backend"
