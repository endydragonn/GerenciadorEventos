apiVersion: apps/v1
kind: Deployment
metadata:
  name: admission
  labels: {app: admission}
spec:
  # sem `replicas`: a autoescala (KEDA/HPA, issue #197 etapa 4) é dona da contagem; reaplicar o manifest não a volta para 1
  selector:
    matchLabels: {app: admission}
  template:
    metadata:
      labels: {app: admission}
    spec:
      # SÓ o admission monta o token de ServiceAccount (D4): ele lê status.readyReplicas do Deployment reservation pela API do Kubernetes (RBAC mínimo em admission-rbac.yaml)
      serviceAccountName: admission
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: espera
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              for alvo in redis:6379 rabbitmq:5672 reservation:8082; do
                host="${alvo%%:*}"; porta="${alvo##*:}"
                until timeout 5 nc -w 2 "$host" "$porta" </dev/null; do echo "aguardando $alvo"; sleep 2; done
              done
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {cpu: 100m, memory: 32Mi}
      containers:
        - name: admission
          image: gerenciador-eventos-admission.slim:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef: {name: env-admission}
          env:
            - {name: MANAGEMENT_SERVER_PORT, value: "8090"}
            # D4: o job de 2 s que grava adm:replicas com o readyReplicas do reservation (desligado no compose). K8S_RESERVATION_MAX = o maxReplicaCount do reservation
            # (o cluster.sh o troca, junto com o do ScaledObject, a partir de K8S_RESERVATION_MAX): leitura fora de [1, max] não grava
            - {name: ADMISSION_K8S_REPLICAS_ENABLED, value: "true"}
            - {name: K8S_RESERVATION_MAX, value: "3"}
            # token SÓ de métrica do KEDA (aceito apenas em GET /internal/metrics/hot): Secret gerado pelo cluster.sh a cada cluster novo, fora do .env
            - name: ADMISSION_METRICS_TOKEN
              valueFrom:
                secretKeyRef: {name: admission-metrics, key: token}
            - {name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED, value: "true"}
            - {name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE, value: "readinessState"}
          ports:
            - {name: http, containerPort: 8085}
            - {name: mgmt, containerPort: 8090}
          startupProbe:
            httpGet: {path: /actuator/health/readiness, port: mgmt}
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 45
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: mgmt}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: mgmt}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              sleep: {seconds: 20}
          securityContext:
            seccompProfile: {type: Localhost, localhostProfile: profiles/admission-seccomp.json}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: admission
  labels: {app: admission}
spec:
  selector: {app: admission}
  ports:
    - {name: http, port: 8085, targetPort: http}
