name: Resumo diário via Telegram

on:
  repository_dispatch:
    types: [daily_summary]

jobs:
  summary:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Gerar resumo
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          REPO: ${{ github.repository }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          SUMMARY_TYPE: ${{ github.event.client_payload.summary_type }}

        run: |
          set -e

          TODAY=$(TZ="America/Sao_Paulo" date '+%Y-%m-%d')
          DISPLAY_DATE=$(TZ="America/Sao_Paulo" date '+%d/%m/%Y')

          echo "======================================"
          echo "Resumo diário"
          echo "Repositório: $REPO"
          echo "Chat ID: $CHAT_ID"
          echo "Tipo: $SUMMARY_TYPE"
          echo "Data: $TODAY"
          echo "======================================"

          # ============================================================
          # PRs ABERTAS
          # ============================================================

          echo "Buscando PRs abertas hoje..."

          OPENED_PRS=""

          for PAGE in {1..10}; do
            DATA=$(gh api \
              "repos/${REPO}/pulls" \
              --method GET \
              -f state=all \
              -f sort=created \
              -f direction=desc \
              -f per_page=100 \
              -f page="$PAGE")

            COUNT=$(echo "$DATA" | jq 'length')

            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            while IFS= read -r PR; do

              NUMBER=$(echo "$PR" | jq -r '.number')
              TITLE=$(echo "$PR" | jq -r '.title')
              BODY=$(echo "$PR" | jq -r '.body // ""')

              # Procura uma Issue explicitamente referenciada
              # no título ou corpo da PR.
              ISSUE_NUMBER=$(printf '%s\n%s' "$TITLE" "$BODY" \
                | grep -Eio '(closes|closed|close|fixes|fixed|fix|resolves|resolved|resolve)[[:space:]]+#[0-9]+' \
                | grep -Eo '#[0-9]+' \
                | head -n 1 \
                | tr -d '#' || true)

              # Caso não encontre "Fixes #123", etc.,
              # procura uma referência simples a #123.
              if [ -z "$ISSUE_NUMBER" ]; then
                ISSUE_NUMBER=$(printf '%s\n%s' "$TITLE" "$BODY" \
                  | grep -Eo '(^|[^[:alnum:]_])#[0-9]+' \
                  | head -n 1 \
                  | tr -d '#' || true)
              fi

              if [ -n "$ISSUE_NUMBER" ]; then
                LINE="• #${NUMBER} — ${TITLE} — Issue #${ISSUE_NUMBER}"
              else
                LINE="• #${NUMBER} — ${TITLE}"
              fi

              if [ -n "$OPENED_PRS" ]; then
                OPENED_PRS="${OPENED_PRS}
          ${LINE}"
              else
                OPENED_PRS="$LINE"
              fi

            done < <(
              echo "$DATA" | jq -c --arg date "$TODAY" '
                .[]
                | select(.created_at | startswith($date))
              '
            )

            OLDEST_DATE=$(echo "$DATA" | jq -r '
              if length > 0
              then .[-1].created_at
              else ""
              end
            ')

            if [[ "$OLDEST_DATE" < "$TODAY" ]]; then
              break
            fi
          done


          # ============================================================
          # PRs FECHADAS
          # ============================================================

          echo "Buscando PRs fechadas hoje..."

          CLOSED_PRS=""

          for PAGE in {1..10}; do
            DATA=$(gh api \
              "repos/${REPO}/pulls" \
              --method GET \
              -f state=closed \
              -f sort=updated \
              -f direction=desc \
              -f per_page=100 \
              -f page="$PAGE")

            COUNT=$(echo "$DATA" | jq 'length')

            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            PAGE_DATA=$(echo "$DATA" | jq -r --arg date "$TODAY" '
              .[]
              | select(.closed_at != null)
              | select(.closed_at | startswith($date))
              | if .merged_at != null then
                  "• #\(.number) — \(.title) — 🔀 Merge"
                else
                  "• #\(.number) — \(.title) — ❌ Fechada"
                end
            ')

            if [ -n "$PAGE_DATA" ]; then
              if [ -n "$CLOSED_PRS" ]; then
                CLOSED_PRS="${CLOSED_PRS}
          ${PAGE_DATA}"
              else
                CLOSED_PRS="$PAGE_DATA"
              fi
            fi

            if [ "$COUNT" -lt 100 ]; then
              break
            fi
          done


          # ============================================================
          # ISSUES FECHADAS
          # ============================================================

          echo "Buscando Issues fechadas hoje..."

          CLOSED_ISSUES=""

          for PAGE in {1..10}; do
            DATA=$(gh api \
              "repos/${REPO}/issues" \
              --method GET \
              -f state=closed \
              -f sort=updated \
              -f direction=desc \
              -f per_page=100 \
              -f page="$PAGE")

            COUNT=$(echo "$DATA" | jq 'length')

            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            PAGE_DATA=$(echo "$DATA" | jq -r --arg date "$TODAY" '
              .[]
              | select(.pull_request == null)
              | select(.closed_at != null)
              | select(.closed_at | startswith($date))
              | "• #\(.number) — \(.title)"
            ')

            if [ -n "$PAGE_DATA" ]; then
              if [ -n "$CLOSED_ISSUES" ]; then
                CLOSED_ISSUES="${CLOSED_ISSUES}
          ${PAGE_DATA}"
              else
                CLOSED_ISSUES="$PAGE_DATA"
              fi
            fi

            if [ "$COUNT" -lt 100 ]; then
              break
            fi
          done


          # ============================================================
          # CONTADORES
          # ============================================================

          OPENED_COUNT=$(echo "$OPENED_PRS" | grep -c '^• #' || true)
          CLOSED_COUNT=$(echo "$CLOSED_PRS" | grep -c '^• #' || true)
          ISSUES_COUNT=$(echo "$CLOSED_ISSUES" | grep -c '^• #' || true)

          MERGED_COUNT=$(echo "$CLOSED_PRS" | grep -c '🔀 Merge' || true)
          CLOSED_ONLY_COUNT=$(echo "$CLOSED_PRS" | grep -c '❌ Fechada' || true)


          # ============================================================
          # RESUMO COMPLETO
          # ============================================================

          if [ "$SUMMARY_TYPE" = "completo" ]; then

            MSG="📊 Resumo — ${DISPLAY_DATE}

          📦 ${REPO}

          🔀 PR abertas"

            if [ -n "$OPENED_PRS" ]; then
              MSG+="
          ${OPENED_PRS}"
            else
              MSG+="
          Nenhuma."
            fi

            MSG+="

          ✅ PR fechadas"

            if [ -n "$CLOSED_PRS" ]; then
              MSG+="
          ${CLOSED_PRS}"
            else
              MSG+="
          Nenhuma."
            fi

            MSG+="

          📋 Issues fechadas"

            if [ -n "$CLOSED_ISSUES" ]; then
              MSG+="
          ${CLOSED_ISSUES}"
            else
              MSG+="
          Nenhuma."
            fi

            MSG+="

          📈 Totais
          • ${OPENED_COUNT} PR abertas
          • ${CLOSED_COUNT} PR fechadas
          • ${ISSUES_COUNT} Issues fechadas"

          else

            # ==========================================================
            # RESUMO RESUMIDO
            # ==========================================================

            MSG="📊 Resumo — ${DISPLAY_DATE}

          📦 ${REPO}

          🔀 PRs
          • ${OPENED_COUNT} abertas
          • ${CLOSED_COUNT} fechadas
          • ${MERGED_COUNT} mergeadas
          • ${CLOSED_ONLY_COUNT} fechadas sem merge

          📋 Issues
          • ${ISSUES_COUNT} fechadas

          📈 Total
          • $((OPENED_COUNT + CLOSED_COUNT + ISSUES_COUNT)) evento(s)"

          fi


          # ============================================================
          # VERIFICA TAMANHO
          # ============================================================

          MESSAGE_LENGTH=${#MSG}

          echo "Tamanho da mensagem: ${MESSAGE_LENGTH} caracteres"

          if [ "$MESSAGE_LENGTH" -gt 4000 ]; then
            echo "AVISO: resumo possui mais de 4000 caracteres."
            echo "Telegram pode rejeitar mensagens acima de 4096 caracteres."
          fi


          # ============================================================
          # ENVIA PARA O TELEGRAM
          # ============================================================

          echo "Enviando resumo..."

          RESPONSE=$(curl -s -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}")

          SUCCESS=$(echo "$RESPONSE" | jq -r '.ok')

          if [ "$SUCCESS" != "true" ]; then
            echo "======================================"
            echo "ERRO AO ENVIAR TELEGRAM"
            echo "$RESPONSE"
            echo "======================================"
            exit 1
          fi

          echo "======================================"
          echo "Resumo enviado com sucesso."
          echo "======================================"
