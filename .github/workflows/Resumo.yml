name: Resumo diário via Telegram

on:
  repository_dispatch:
    types: [daily_summary]

jobs:
  summary:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Gerar resumo
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          REPO: ${{ github.repository }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}

        run: |
          set -e

          TODAY=$(TZ="America/Sao_Paulo" date '+%Y-%m-%d')
          DISPLAY_DATE=$(TZ="America/Sao_Paulo" date '+%d/%m/%Y')

          echo "======================================"
          echo "Gerando resumo de $TODAY"
          echo "Repositório: $REPO"
          echo "Chat ID: $CHAT_ID"
          echo "======================================"

          # ==========================================
          # PRs ABERTAS HOJE
          # ==========================================

          echo "Buscando PRs abertas hoje..."

          OPENED_PRS=""

          for PAGE in {1..10}; do

            DATA=$(gh api \
              "repos/${REPO}/pulls" \
              --method GET \
              -f state=all \
              -f sort=created \
              -f direction=desc \
              -f per_page=100 \
              -f page="$PAGE")

            COUNT=$(echo "$DATA" | jq 'length')

            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            PAGE_DATA=$(echo "$DATA" | jq -r --arg date "$TODAY" '
              .[]
              | select(.created_at | startswith($date))
              | "• #\(.number) — \(.title)\n  👤 \(.user.login)"
            ')

            if [ -n "$PAGE_DATA" ]; then
              if [ -n "$OPENED_PRS" ]; then
                OPENED_PRS="${OPENED_PRS}
          ${PAGE_DATA}"
              else
                OPENED_PRS="$PAGE_DATA"
              fi
            fi

            # Como está ordenado por created_at desc,
            # quando a PR mais antiga da página já é anterior
            # a hoje, não precisamos continuar.
            OLDEST_DATE=$(echo "$DATA" | jq -r '
              if length > 0 then .[-1].created_at else "" end
            ')

            if [[ "$OLDEST_DATE" < "$TODAY" ]]; then
              break
            fi

          done


          # ==========================================
          # PRs FECHADAS / MERGEADAS HOJE
          # ==========================================

          echo "Buscando PRs fechadas/mergeadas hoje..."

          CLOSED_PRS=""

          for PAGE in {1..10}; do

            DATA=$(gh api \
              "repos/${REPO}/pulls" \
              --method GET \
              -f state=closed \
              -f sort=updated \
              -f direction=desc \
              -f per_page=100 \
              -f page="$PAGE")

            COUNT=$(echo "$DATA" | jq 'length')

            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            PAGE_DATA=$(echo "$DATA" | jq -r --arg date "$TODAY" '
              .[]
              | select(.closed_at != null)
              | select(.closed_at | startswith($date))
              | if .merged_at != null then
                  "• #\(.number) — \(.title)\n  👤 \(.user.login)\n  🔀 Mergeado"
                else
                  "• #\(.number) — \(.title)\n  👤 \(.user.login)\n  ❌ Fechado"
                end
            ')

            if [ -n "$PAGE_DATA" ]; then
              if [ -n "$CLOSED_PRS" ]; then
                CLOSED_PRS="${CLOSED_PRS}
          ${PAGE_DATA}"
              else
                CLOSED_PRS="$PAGE_DATA"
              fi
            fi

            # Verifica a data de fechamento mais antiga
            # encontrada nesta página.
            OLDEST_CLOSED_DATE=$(echo "$DATA" | jq -r '
              [
                .[]
                | select(.closed_at != null)
                | .closed_at
              ]
              | if length > 0 then .[-1] else "" end
            ')

            if [ -n "$OLDEST_CLOSED_DATE" ] && [[ "$OLDEST_CLOSED_DATE" < "$TODAY" ]]; then
              break
            fi

          done


          # ==========================================
          # ISSUES FECHADAS HOJE
          # ==========================================

          echo "Buscando Issues fechadas hoje..."

          CLOSED_ISSUES=""

          for PAGE in {1..10}; do

            DATA=$(gh api \
              "repos/${REPO}/issues" \
              --method GET \
              -f state=closed \
              -f sort=updated \
              -f direction=desc \
              -f per_page=100 \
              -f page="$PAGE")

            COUNT=$(echo "$DATA" | jq 'length')

            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            PAGE_DATA=$(echo "$DATA" | jq -r --arg date "$TODAY" '
              .[]
              | select(.pull_request == null)
              | select(.closed_at != null)
              | select(.closed_at | startswith($date))
              | "• #\(.number) — \(.title)\n  👤 \(.user.login)"
            ')

            if [ -n "$PAGE_DATA" ]; then
              if [ -n "$CLOSED_ISSUES" ]; then
                CLOSED_ISSUES="${CLOSED_ISSUES}
          ${PAGE_DATA}"
              else
                CLOSED_ISSUES="$PAGE_DATA"
              fi
            fi

            OLDEST_CLOSED_DATE=$(echo "$DATA" | jq -r '
              [
                .[]
                | select(.pull_request == null)
                | select(.closed_at != null)
                | .closed_at
              ]
              | if length > 0 then .[-1] else "" end
            ')

            if [ -n "$OLDEST_CLOSED_DATE" ] && [[ "$OLDEST_CLOSED_DATE" < "$TODAY" ]]; then
              break
            fi

          done


          # ==========================================
          # MONTA A MENSAGEM
          # ==========================================

          MSG="📊 Resumo do dia — ${DISPLAY_DATE}

          📦 ${REPO}

          🔀 PRs abertas hoje"

          if [ -n "$OPENED_PRS" ]; then
            MSG+="
          ${OPENED_PRS}"
          else
            MSG+="
          Nenhuma PR aberta hoje."
          fi


          MSG+="

          ✅ PRs fechadas/mergeadas hoje"

          if [ -n "$CLOSED_PRS" ]; then
            MSG+="
          ${CLOSED_PRS}"
          else
            MSG+="
          Nenhuma PR fechada hoje."
          fi


          MSG+="

          📋 Issues fechadas hoje"

          if [ -n "$CLOSED_ISSUES" ]; then
            MSG+="
          ${CLOSED_ISSUES}"
          else
            MSG+="
          Nenhuma Issue fechada hoje."
          fi


          # ==========================================
          # CONTADORES
          # ==========================================

          OPENED_COUNT=$(echo "$OPENED_PRS" | grep -c '^• #' || true)
          CLOSED_COUNT=$(echo "$CLOSED_PRS" | grep -c '^• #' || true)
          ISSUES_COUNT=$(echo "$CLOSED_ISSUES" | grep -c '^• #' || true)


          MSG+="

          📈 Total
          • ${OPENED_COUNT} PR(s) aberta(s)
          • ${CLOSED_COUNT} PR(s) fechada(s)
          • ${ISSUES_COUNT} Issue(s) fechada(s)"


          # ==========================================
          # ENVIA PARA O TELEGRAM
          # ==========================================

          echo "Enviando resumo para o Telegram..."

          RESPONSE=$(curl -s -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}")

          SUCCESS=$(echo "$RESPONSE" | jq -r '.ok')

          if [ "$SUCCESS" != "true" ]; then
            echo "Erro ao enviar mensagem para o Telegram:"
            echo "$RESPONSE"
            exit 1
          fi

          echo "======================================"
          echo "Resumo enviado com sucesso."
          echo "======================================"
