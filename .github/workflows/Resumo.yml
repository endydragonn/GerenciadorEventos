# Gera resumos de PRs mergeadas e Issues fechadas e devolve os dados para o servidor.
name: Resumo diário via Telegram

on:
  repository_dispatch:
    types: [daily_summary]

jobs:
  summary:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Gerar resumo e enviar ao servidor
        env:
          GH_TOKEN: ${{ github.token }}
          # URL fixa da sua aplicação no Render
          SERVER_URL: "https://telegram-bot-rcu4.onrender.com/webhook/resumo"
          SERVER_TOKEN: ${{ secrets.SERVER_API_TOKEN }}

          REPO: ${{ github.repository }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          SUMMARY_TYPE: ${{ github.event.client_payload.summary_type }}
          DAYS: ${{ github.event.client_payload.days || 1 }}

        run: |
          set -e

          TODAY=$(TZ="America/Sao_Paulo" date '+%Y-%m-%d')
          DISPLAY_DATE=$(TZ="America/Sao_Paulo" date '+%d/%m/%Y')

          if [ "$DAYS" = "all" ]; then
            START_DATE="1970-01-01"
            HEADER="📊 Resumo (Todo o histórico) — ${DISPLAY_DATE}"
          else
            if ! [[ "$DAYS" =~ ^[1-7]$ ]]; then
              DAYS=1
            fi

            OFFSET=$((DAYS - 1))
            START_DATE=$(TZ="America/Sao_Paulo" date -d "$OFFSET days ago" '+%Y-%m-%d')
            START_DISPLAY_DATE=$(TZ="America/Sao_Paulo" date -d "$OFFSET days ago" '+%d/%m/%Y')

            if [ "$DAYS" -eq 1 ]; then
              HEADER="📊 Resumo — ${DISPLAY_DATE}"
            else
              HEADER="📊 Resumo (${DAYS} dias) — ${START_DISPLAY_DATE} até ${DISPLAY_DATE}"
            fi
          fi

          echo "======================================"
          echo "Resumo de Atividades"
          echo "Repositório: $REPO"
          echo "Chat ID: $CHAT_ID"
          echo "Tipo: $SUMMARY_TYPE"
          echo "Data início: $START_DATE"
          echo "Servidor Destino: $SERVER_URL"
          echo "======================================"


          # ============================================================
          # PRs MERGEADAS NO PERÍODO
          # ============================================================

          echo "Buscando PRs mergeadas..."

          MERGED_PRS=""

          for PAGE in {1..10}; do

            DATA=$(gh api \
              "repos/${REPO}/pulls" \
              --method GET \
              -f state=closed \
              -f sort=updated \
              -f direction=desc \
              -f per_page=100 \
              -f page="$PAGE")

            COUNT=$(echo "$DATA" | jq 'length')

            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            PAGE_DATA=$(echo "$DATA" | jq -r --arg start "$START_DATE" '
              .[]
              | select(.merged_at != null)
              | select((.merged_at | split("T")[0]) >= $start)
              | "• #\(.number) — \(.title)"
            ')

            if [ -n "$PAGE_DATA" ]; then
              if [ -n "$MERGED_PRS" ]; then
                MERGED_PRS="${MERGED_PRS}
${PAGE_DATA}"
              else
                MERGED_PRS="$PAGE_DATA"
              fi
            fi

            if [ "$COUNT" -lt 100 ]; then
              break
            fi

          done


          # ============================================================
          # ISSUES FECHADAS NO PERÍODO
          # ============================================================

          echo "Buscando Issues fechadas..."

          CLOSED_ISSUES=""

          for PAGE in {1..10}; do

            DATA=$(gh api \
              "repos/${REPO}/issues" \
              --method GET \
              -f state=closed \
              -f sort=updated \
              -f direction=desc \
              -f per_page=100 \
              -f page="$PAGE")

            COUNT=$(echo "$DATA" | jq 'length')

            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            PAGE_DATA=$(echo "$DATA" | jq -r --arg start "$START_DATE" '
              .[]
              | select(.pull_request == null)
              | select(.closed_at != null)
              | select((.closed_at | split("T")[0]) >= $start)
              | "• #\(.number) — \(.title)"
            ')

            if [ -n "$PAGE_DATA" ]; then
              if [ -n "$CLOSED_ISSUES" ]; then
                CLOSED_ISSUES="${CLOSED_ISSUES}
${PAGE_DATA}"
              else
                CLOSED_ISSUES="$PAGE_DATA"
              fi
            fi

            if [ "$COUNT" -lt 100 ]; then
              break
            fi

          done


          # ============================================================
          # CONTADORES
          # ============================================================

          MERGED_COUNT=$(echo "$MERGED_PRS" | grep -c '^• #' || true)
          ISSUES_COUNT=$(echo "$CLOSED_ISSUES" | grep -c '^• #' || true)

          TOTAL_COUNT=$((MERGED_COUNT + ISSUES_COUNT))


          # ============================================================
          # RESUMO COMPLETO
          # ============================================================

          if [ "$SUMMARY_TYPE" = "completo" ]; then

            MSG="${HEADER}

📦 ${REPO}

🔀 PRs mergeadas"

            if [ -n "$MERGED_PRS" ]; then
              MSG+="
${MERGED_PRS}"
            else
              MSG+="
Nenhuma."
            fi

            MSG+="

📋 Issues fechadas"

            if [ -n "$CLOSED_ISSUES" ]; then
              MSG+="
${CLOSED_ISSUES}"
            else
              MSG+="
Nenhuma."
            fi

            MSG+="

📈 Totais
• ${MERGED_COUNT} PRs mergeadas
• ${ISSUES_COUNT} Issues fechadas"

          else

            # ==========================================================
            # RESUMO RESUMIDO
            # ==========================================================

            MSG="${HEADER}

📦 ${REPO}

🔀 PRs
• ${MERGED_COUNT} mergeadas

📋 Issues
• ${ISSUES_COUNT} fechadas

📈 Total
• ${TOTAL_COUNT} evento(s)"

          fi


          # ============================================================
          # DEVOLVE OS DADOS PARA O SERVIDOR BACKEND (RENDER)
          # ============================================================

          MESSAGE_LENGTH=${#MSG}
          echo "Tamanho da mensagem: ${MESSAGE_LENGTH} caracteres"

          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg summary_type "$SUMMARY_TYPE" \
            --arg start_date "$START_DATE" \
            --arg chat_id "$CHAT_ID" \
            --arg message "$MSG" \
            --argjson total "$TOTAL_COUNT" \
            --argjson merged "$MERGED_COUNT" \
            --argjson issues "$ISSUES_COUNT" \
            '{
              repository: $repo,
              summary_type: $summary_type,
              start_date: $start_date,
              chat_id: $chat_id,
              message: $message,
              totals: {
                merged_prs: $merged,
                closed_issues: $issues,
                total: $total
              }
            }')

          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST "$SERVER_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SERVER_TOKEN:-}" \
            -d "$PAYLOAD")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Resumo devolvido com sucesso ao servidor ($HTTP_STATUS)."
          else
            echo "======================================"
            echo "ERRO AO DEVOLVER PARA O SERVIDOR ($HTTP_STATUS)"
            cat response.txt
            echo "======================================"
            exit 1
          fi
