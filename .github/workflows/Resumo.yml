name: Resumo diário via Telegram

on:
  repository_dispatch:
    types: [daily_summary]

jobs:
  summary:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Gerar resumo
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          REPO: ${{ github.repository }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          SUMMARY_TYPE: ${{ github.event.client_payload.summary_type }}

        run: |
          set -e

          TODAY=$(TZ="America/Sao_Paulo" date '+%Y-%m-%d')
          DISPLAY_DATE=$(TZ="America/Sao_Paulo" date '+%d/%m/%Y')

          echo "======================================"
          echo "Resumo diário"
          echo "Repositório: $REPO"
          echo "Chat ID: $CHAT_ID"
          echo "Tipo: $SUMMARY_TYPE"
          echo "Data: $TODAY"
          echo "======================================"


          # ============================================================
          # PRs MERGEADAS HOJE
          # ============================================================

          echo "Buscando PRs mergeadas hoje..."

          MERGED_PRS=""

          for PAGE in {1..10}; do

            DATA=$(gh api \
              "repos/${REPO}/pulls" \
              --method GET \
              -f state=closed \
              -f sort=updated \
              -f direction=desc \
              -f per_page=100 \
              -f page="$PAGE")

            COUNT=$(echo "$DATA" | jq 'length')

            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            PAGE_DATA=$(echo "$DATA" | jq -r --arg date "$TODAY" '
              .[]
              | select(.merged_at != null)
              | select(.merged_at | startswith($date))
              | "• #\(.number) — \(.title)"
            ')

            if [ -n "$PAGE_DATA" ]; then
              if [ -n "$MERGED_PRS" ]; then
                MERGED_PRS="${MERGED_PRS}
          ${PAGE_DATA}"
              else
                MERGED_PRS="$PAGE_DATA"
              fi
            fi

            if [ "$COUNT" -lt 100 ]; then
              break
            fi

          done


          # ============================================================
          # ISSUES FECHADAS HOJE
          # ============================================================

          echo "Buscando Issues fechadas hoje..."

          CLOSED_ISSUES=""

          for PAGE in {1..10}; do

            DATA=$(gh api \
              "repos/${REPO}/issues" \
              --method GET \
              -f state=closed \
              -f sort=updated \
              -f direction=desc \
              -f per_page=100 \
              -f page="$PAGE")

            COUNT=$(echo "$DATA" | jq 'length')

            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            PAGE_DATA=$(echo "$DATA" | jq -r --arg date "$TODAY" '
              .[]
              | select(.pull_request == null)
              | select(.closed_at != null)
              | select(.closed_at | startswith($date))
              | "• #\(.number) — \(.title)"
            ')

            if [ -n "$PAGE_DATA" ]; then
              if [ -n "$CLOSED_ISSUES" ]; then
                CLOSED_ISSUES="${CLOSED_ISSUES}
          ${PAGE_DATA}"
              else
                CLOSED_ISSUES="$PAGE_DATA"
              fi
            fi

            if [ "$COUNT" -lt 100 ]; then
              break
            fi

          done


          # ============================================================
          # CONTADORES
          # ============================================================

          MERGED_COUNT=$(echo "$MERGED_PRS" | grep -c '^• #' || true)
          ISSUES_COUNT=$(echo "$CLOSED_ISSUES" | grep -c '^• #' || true)

          TOTAL_COUNT=$((MERGED_COUNT + ISSUES_COUNT))


          # ============================================================
          # RESUMO COMPLETO
          # ============================================================

          if [ "$SUMMARY_TYPE" = "completo" ]; then

            MSG="📊 Resumo — ${DISPLAY_DATE}

          📦 ${REPO}

          🔀 PRs mergeadas"

            if [ -n "$MERGED_PRS" ]; then
              MSG+="
          ${MERGED_PRS}"
            else
              MSG+="
          Nenhuma."
            fi

            MSG+="

          📋 Issues fechadas"

            if [ -n "$CLOSED_ISSUES" ]; then
              MSG+="
          ${CLOSED_ISSUES}"
            else
              MSG+="
          Nenhuma."
            fi

            MSG+="

          📈 Totais
          • ${MERGED_COUNT} PRs mergeadas
          • ${ISSUES_COUNT} Issues fechadas"

          else

            # ==========================================================
            # RESUMO RESUMIDO
            # ==========================================================

            MSG="📊 Resumo — ${DISPLAY_DATE}

          📦 ${REPO}

          🔀 PRs
          • ${MERGED_COUNT} mergeadas

          📋 Issues
          • ${ISSUES_COUNT} fechadas

          📈 Total
          • ${TOTAL_COUNT} evento(s)"

          fi


          # ============================================================
          # VERIFICA TAMANHO
          # ============================================================

          MESSAGE_LENGTH=${#MSG}

          echo "Tamanho da mensagem: ${MESSAGE_LENGTH} caracteres"

          if [ "$MESSAGE_LENGTH" -gt 4000 ]; then
            echo "AVISO: resumo possui mais de 4000 caracteres."
            echo "Telegram possui limite de 4096 caracteres."
          fi


          # ============================================================
          # ENVIA PARA O TELEGRAM
          # ============================================================

          echo "Enviando resumo..."

          RESPONSE=$(curl -s -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}")

          SUCCESS=$(echo "$RESPONSE" | jq -r '.ok')

          if [ "$SUCCESS" != "true" ]; then
            echo "======================================"
            echo "ERRO AO ENVIAR TELEGRAM"
            echo "$RESPONSE"
            echo "======================================"
            exit 1
          fi

          echo "======================================"
          echo "Resumo enviado com sucesso."
          echo "======================================"
