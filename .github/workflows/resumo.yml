# DESCRIPTION: Gera resumos de PRs mergeadas e Issues fechadas (hoje, 1-10 dias ou todo o histórico).
name: Resumo diário via Telegram

on:
  repository_dispatch:
    types: [daily_summary]

jobs:
  summary:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Gerar e enviar resumo para o Bot
        env:
          BOT_URL: "https://telegram-bot-rcu4.onrender.com"
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          SUMMARY_TYPE: ${{ github.event.client_payload.summary_type }}
          DAYS: ${{ github.event.client_payload.days || 1 }}

        run: |
          set -e

          TODAY=$(TZ="America/Sao_Paulo" date '+%Y-%m-%d')
          DISPLAY_DATE=$(TZ="America/Sao_Paulo" date '+%d/%m/%Y')

          if [ "$DAYS" = "all" ]; then
            START_DATE="1970-01-01"
            HEADER="📊 Resumo (Todo o histórico) — ${DISPLAY_DATE}"
          else
            if ! [[ "$DAYS" =~ ^([1-9]|10)$ ]]; then
              DAYS=1
            fi

            OFFSET=$((DAYS - 1))
            START_DATE=$(TZ="America/Sao_Paulo" date -d "$OFFSET days ago" '+%Y-%m-%d')
            START_DISPLAY_DATE=$(TZ="America/Sao_Paulo" date -d "$OFFSET days ago" '+%d/%m/%Y')

            if [ "$DAYS" -eq 1 ]; then
              HEADER="📊 Resumo — ${DISPLAY_DATE}"
            else
              HEADER="📊 Resumo (${DAYS} dias) — ${START_DISPLAY_DATE} até ${DISPLAY_DATE}"
            fi
          fi

          echo "======================================"
          echo "Resumo de Atividades"
          echo "Repositório: $REPO"
          echo "Chat ID: $CHAT_ID"
          echo "Tipo: $SUMMARY_TYPE"
          echo "Data início: $START_DATE"
          echo "======================================"

          # ============================================================
          # PRs MERGEADAS NO PERÍODO
          # ============================================================

          echo "Buscando PRs mergeadas..."
          MERGED_PRS=""

          for PAGE in {1..10}; do
            DATA=$(gh api \
              "repos/${REPO}/pulls" \
              --method GET \
              -f state=closed \
              -f sort=updated \
              -f direction=desc \
              -f per_page=100 \
              -f page="$PAGE")

            COUNT=$(echo "$DATA" | jq 'length')

            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            PAGE_DATA=$(echo "$DATA" | jq -r --arg start "$START_DATE" '
              .[]
              | select(.merged_at != null)
              | select((.merged_at | split("T")[0]) >= $start)
              | "• #\(.number) — \(.title)"
            ')

            if [ -n "$PAGE_DATA" ]; then
              if [ -n "$MERGED_PRS" ]; then
                MERGED_PRS="${MERGED_PRS}\n${PAGE_DATA}"
              else
                MERGED_PRS="$PAGE_DATA"
              fi
            fi

            if [ "$COUNT" -lt 100 ]; then
              break
            fi
          done

          # Converte sequências \n em quebras reais mantendo formato
          MERGED_PRS=$(printf "%b" "$MERGED_PRS")

          # ============================================================
          # ISSUES FECHADAS NO PERÍODO
          # ============================================================

          echo "Buscando Issues fechadas..."
          CLOSED_ISSUES=""

          for PAGE in {1..10}; do
            DATA=$(gh api \
              "repos/${REPO}/issues" \
              --method GET \
              -f state=closed \
              -f sort=updated \
              -f direction=desc \
              -f per_page=100 \
              -f page="$PAGE")

            COUNT=$(echo "$DATA" | jq 'length')

            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            PAGE_DATA=$(echo "$DATA" | jq -r --arg start "$START_DATE" '
              .[]
              | select(.pull_request == null)
              | select(.closed_at != null)
              | select((.closed_at | split("T")[0]) >= $start)
              | "• #\(.number) — \(.title)"
            ')

            if [ -n "$PAGE_DATA" ]; then
              if [ -n "$CLOSED_ISSUES" ]; then
                CLOSED_ISSUES="${CLOSED_ISSUES}\n${PAGE_DATA}"
              else
                CLOSED_ISSUES="$PAGE_DATA"
              fi
            fi

            if [ "$COUNT" -lt 100 ]; then
              break
            fi
          done

          # Converte sequências \n em quebras reais mantendo formato
          CLOSED_ISSUES=$(printf "%b" "$CLOSED_ISSUES")

          # ============================================================
          # CONTADORES E MONTAGEM DA MENSAGEM
          # ============================================================

          MERGED_COUNT=$(echo "$MERGED_PRS" | grep -c '^• #' || true)
          ISSUES_COUNT=$(echo "$CLOSED_ISSUES" | grep -c '^• #' || true)
          TOTAL_COUNT=$((MERGED_COUNT + ISSUES_COUNT))

          if [ -n "$MERGED_PRS" ]; then
            PR_TEXT="$MERGED_PRS"
          else
            PR_TEXT="Nenhuma."
          fi

          if [ -n "$CLOSED_ISSUES" ]; then
            ISSUE_TEXT="$CLOSED_ISSUES"
          else
            ISSUE_TEXT="Nenhuma."
          fi

          if [ "$SUMMARY_TYPE" = "completo" ]; then
            MSG=$(printf "%b\n\n📦 %s\n\n🔀 PRs mergeadas\n%s\n\n📋 Issues fechadas\n%s\n\n📈 Totais\n• %d PRs mergeadas\n• %d Issues fechadas" \
              "$HEADER" "$REPO" "$PR_TEXT" "$ISSUE_TEXT" "$MERGED_COUNT" "$ISSUES_COUNT")
          else
            MSG=$(printf "%b\n\n📦 %s\n\n🔀 PRs\n• %d mergeadas\n\n📋 Issues\n• %d fechadas\n\n📈 Total\n• %d evento(s)" \
              "$HEADER" "$REPO" "$MERGED_COUNT" "$ISSUES_COUNT" "$TOTAL_COUNT")
          fi

          # ============================================================
          # MONTAGEM DO PAYLOAD JSON VIA JQ E ENVIO AO BOT
          # ============================================================

          PAYLOAD=$(jq -n \
            --arg chat_id "$CHAT_ID" \
            --arg text "$MSG" \
            '{chat_id: $chat_id, text: $text}')

          curl -s -X POST "${BOT_URL}/webhook/github-summary" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"