# DESCRIPTION: Gera resumos de PRs mergeadas e Issues fechadas (hoje, 1-10 dias ou todo o histórico).
name: Resumo diário via Telegram

on:
  repository_dispatch:
    types: [daily_summary]

jobs:
  summary:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Gerar resumo
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_URL: "https://telegram-bot-rcu4.onrender.com"
          REPO: ${{ github.repository }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          SUMMARY_TYPE: ${{ github.event.client_payload.summary_type }}
          DAYS: ${{ github.event.client_payload.days || 1 }}

        run: |
          set -e

          TODAY=$(TZ="America/Sao_Paulo" date '+%Y-%m-%d')
          DISPLAY_DATE=$(TZ="America/Sao_Paulo" date '+%d/%m/%Y')

          if [ "$DAYS" = "all" ]; then
            START_DATE="1970-01-01"
            HEADER="📊 Resumo (Todo o histórico) — ${DISPLAY_DATE}"
          else
            if ! [[ "$DAYS" =~ ^([1-9]|10)$ ]]; then
              DAYS=1
            fi

            OFFSET=$((DAYS - 1))
            START_DATE=$(TZ="America/Sao_Paulo" date -d "$OFFSET days ago" '+%Y-%m-%d')
            START_DISPLAY_DATE=$(TZ="America/Sao_Paulo" date -d "$OFFSET days ago" '+%d/%m/%Y')

            if [ "$DAYS" -eq 1 ]; then
              HEADER="📊 Resumo — ${DISPLAY_DATE}"
            else
              HEADER="📊 Resumo (${DAYS} dias) — ${START_DISPLAY_DATE} até ${DISPLAY_DATE}"
            fi
          fi

          echo "======================================"
          echo "Resumo de Atividades"
          echo "Repositório: $REPO"
          echo "Chat ID: $CHAT_ID"
          echo "Tipo: $SUMMARY_TYPE"
          echo "Data início: $START_DATE"
          echo "======================================"

          # ============================================================
          # PRs MERGEADAS NO PERÍODO
          # ============================================================

          echo "Buscando PRs mergeadas..."
          MERGED_PRS=""

          for PAGE in {1..10}; do
            DATA=$(gh api \
              "repos/${REPO}/pulls" \
              --method GET \
              -f state=closed \
              -f sort=updated \
              -f direction=desc \
              -f per_page=100 \
              -f page="$PAGE")

            COUNT=$(echo "$DATA" | jq 'length')

            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            PAGE_DATA=$(echo "$DATA" | jq -r --arg start "$START_DATE" '
              .[]
              | select(.merged_at != null)
              | select((.merged_at | split("T")[0]) >= $start)
              | "• #\(.number) — \(.title)"
            ')

            if [ -n "$PAGE_DATA" ]; then
              if [ -n "$MERGED_PRS" ]; then
                MERGED_PRS="${MERGED_PRS}
${PAGE_DATA}"
              else
                MERGED_PRS="$PAGE_DATA"
              fi
            fi

            if [ "$COUNT" -lt 100 ]; then
              break
            fi
          done

          # ============================================================
          # ISSUES FECHADAS NO PERÍODO
          # ============================================================

          echo "Buscando Issues fechadas..."
          CLOSED_ISSUES=""

          for PAGE in {1..10}; do
            DATA=$(gh api \
              "repos/${REPO}/issues" \
              --method GET \
              -f state=closed \
              -f sort=updated \
              -f direction=desc \
              -f per_page=100 \
              -f page="$PAGE")

            COUNT=$(echo "$DATA" | jq 'length')

            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            PAGE_DATA=$(echo "$DATA" | jq -r --arg start "$START_DATE" '
              .[]
              | select(.pull_request == null)
              | select(.closed_at != null)
              | select((.closed_at | split("T")[0]) >= $start)
              | "• #\(.number) — \(.title)"
            ')

            if [ -n "$PAGE_DATA" ]; then
              if [ -n "$CLOSED_ISSUES" ]; then
                CLOSED_ISSUES="${CLOSED_ISSUES}
${PAGE_DATA}"
              else
                CLOSED_ISSUES="$PAGE_DATA"
              fi
            fi

            if [ "$COUNT" -lt 100 ]; then
              break
            fi
          done

          # ============================================================
          # CONTADORES E MONTAGEM DA MENSAGEM
          # ============================================================

          MERGED_COUNT=$(echo "$MERGED_PRS" | grep -c '^• #' || true)
          ISSUES_COUNT=$(echo "$CLOSED_ISSUES" | grep -c '^• #' || true)
          TOTAL_COUNT=$((MERGED_COUNT + ISSUES_COUNT))

          if [ "$SUMMARY_TYPE" = "completo" ]; then
            MSG="${HEADER}

📦 ${REPO}

🔀 PRs mergeadas"

            if [ -n "$MERGED_PRS" ]; then
              MSG+="
${MERGED_PRS}"
            else
              MSG+="
Nenhuma."
            fi

            MSG+="

📋 Issues fechadas"

            if [ -n "$CLOSED_ISSUES" ]; then
              MSG+="
${CLOSED_ISSUES}"
            else
              MSG+="
Nenhuma."
            fi

            MSG+="

📈 Totais
• ${MERGED_COUNT} PRs mergeadas
• ${ISSUES_COUNT} Issues fechadas"

          else
            MSG="${HEADER}

📦 ${REPO}

🔀 PRs
• ${MERGED_COUNT} mergeadas

📋 Issues
• ${ISSUES_COUNT} fechadas

📈 Total
• ${TOTAL_COUNT} evento(s)"
          fi

          # ============================================================
          # ENVIO DIRETO PARA O BOT NO TELEGRAM
          # ============================================================
          PAYLOAD=$(jq -n \
            --arg chat_id "$CHAT_ID" \
            --arg text "$MSG" \
            '{chat_id: $chat_id, text: $text}')

          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST "${SERVER_URL}/webhook/github-summary" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Resumo enviado com sucesso ($HTTP_STATUS)."
          else
            echo "ERRO AO ENVIAR PARA O SERVIDOR ($HTTP_STATUS)"
            cat response.txt
            exit 1
          fi
