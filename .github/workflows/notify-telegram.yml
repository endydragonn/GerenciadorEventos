# DESCRIPTION: Notifica abertura de PRs para o servidor central do bot sem precisar de secrets de Chat ID.
name: Notificar PR via Telegram

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Enviar notificação para o Bot
        env:
          BOT_URL: "https://telegram-bot-rcu4.onrender.com" # Substitua pela sua URL no Render
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          USER: ${{ github.event.pull_request.user.login }}
          REVIEWERS: ${{ toJson(github.event.pull_request.requested_reviewers) }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_BODY: ${{ github.event.pull_request.body }}

        run: |
          set -e

          # Detecção de Claude Code
          if echo "$PR_BODY" | grep -Fq "https://claude.com/claude-code"; then
            CLAUDE_REVIEW="true"
          else
            CLAUDE_REVIEW="false"
          fi

          # Status do PR
          if [ "$PR_DRAFT" = "true" ]; then
            PR_STATUS="📝 Draft"
          else
            PR_STATUS="🟢 Ready for review"
          fi

          # Formata a lista de revisores em array JSON
          REVIEWER_LIST=$(echo "$REVIEWERS" | jq -c '[.[].login]')

          # Monta o JSON de payload
          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --argjson pr_number "$PR_NUMBER" \
            --arg pr_title "$PR_TITLE" \
            --arg pr_url "$PR_URL" \
            --arg author "$USER" \
            --arg status "$PR_STATUS" \
            --argjson reviewers "$REVIEWER_LIST" \
            --argjson claude_review "$CLAUDE_REVIEW" \
            '{repo: $repo, pr_number: $pr_number, pr_title: $pr_title, pr_url: $pr_url, author: $author, status: $status, reviewers: $reviewers, claude_review: $claude_review}')

          # Envia a notificação ao bot central
          curl -s -X POST "${BOT_URL}/webhook/github-pr" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"