name: Notificar PR via Telegram

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Enviar notificação Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          USER: ${{ github.event.pull_request.user.login }}
          REVIEWERS: ${{ toJson(github.event.pull_request.requested_reviewers) }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          GH_TOKEN: ${{ github.token }}

        run: |
          # Busca o corpo atual do PR
          PR_BODY=$(gh api \
            "repos/${REPO}/pulls/${PR_NUMBER}" \
            --jq '.body // ""')

          # Verifica se o Claude Code gerou o PR
          if echo "$PR_BODY" | grep -Fq "https://claude.com/claude-code"; then
            CLAUDE_REVIEW="• Claude"
          else
            CLAUDE_REVIEW=""
          fi
          
          REVIEWER_NAMES=$(echo "$REVIEWERS" | jq -r '.[].login' | sed 's/^/• /')

          if [ "$PR_DRAFT" = "true" ]; then
            PR_STATUS="📝 Draft"
          else
            PR_STATUS="🟢 Ready for review"
          fi

          MSG="🎉 O ${USER} abriu um PR pra você revisar!"$'\n\n'
          MSG+="📦 ${REPO}"$'\n'
          MSG+="📋 #${PR_NUMBER}: ${PR_TITLE}"$'\n'
          MSG+="📌 Status: ${PR_STATUS}"
          MSG+="🔗 ${PR_URL}"$'\n\n'

          if [ -n "$REVIEWER_NAMES" ]; then
            MSG+="👀 Revisores:"$'\n'
            MSG+="${REVIEWER_NAMES}"$'\n\n'
          fi

          MSG+="🤖 Pré-review:"$'\n'
          if [ -n "$CLAUDE_REVIEW" ]; then
            MSG+="${CLAUDE_REVIEW}"$'\n'
          fi
          MSG+="• GitHub Copilot"$'\n'
          
          MSG+=$'\n'"👀 Dá uma olhada quando puder."

          IFS=',' read -ra IDS <<< "$CHAT_IDS"

          for ID in "${IDS[@]}"; do
            ID=$(echo "$ID" | tr -d ' ')

            curl -s -X POST \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${ID}" \
              --data-urlencode "text=${MSG}"

            echo "Enviado para chat $ID"
          done
